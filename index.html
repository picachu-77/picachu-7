      +'<div style="font-size:11px;color:var(--muted);margin-bottom:10px">🔀 두 선수 이름을 차례로 누르면 자리를 바꿀 수 있어요</div>';
    for(var i=0;i<S.tTeams.length;i++){
      var t=S.tTeams[i];
      var c=TC[i%TC.length];
      out+='<div style="display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;background:var(--card);border:1px solid var(--border);margin-bottom:6px">'
        +'<div style="width:22px;height:22px;border-radius:50%;background:'+c+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0">'+(i+1)+'</div>'
        +'<div style="flex:1;display:flex;align-items:center;gap:6px">'
          +tSwapCell(t.p1,t.id,'p1')
          +'<span style="color:var(--muted);font-size:12px">+</span>'
          +tSwapCell(t.p2,t.id,'p2')
        +'</div>'
        +'</div>';
    }
    out+='<button class="btn pri" data-a="tStartBracket" style="width:100%;margin-top:10px;font-size:15px;padding:14px">🏆 토너먼트 시작 →</button>';
    out+='</div>';
  }
  return out;
}
// 팀 구성 화면에서 선수 자리 바꾸기용 셀
function tSwapCell(pl,tid,slot){
  var key='T'+tid+'_'+slot;
  var sel=(S.swapSel===key);

  var out='<div class="ttl">🏆 토너먼트</div>';

  if(champion){

      +'<div style="font-size:32px">🏆</div>'
      +'<div style="font-size:12px;color:var(--muted);margin:4px 0">우승</div>'
      +'<div style="font-size:20px;font-weight:800;color:var(--warn)">'+tTeamName(champion)+'</div>'
      +'</div>';
  }
  out+='<div style="font-size:11px;color:var(--muted);margin-bottom:12px">👇 이긴 팀을 누르면 다음 판으로 올라가요 · 점수는 원하면 입력하세요</div>';

  // 라운드별 표시
  for(var r=0;r<S.tBracket.length;r++){
    out+='<div class="set-divider"><div class="set-divider-line"></div>'
      +'<span class="set-divider-label">'+roundNames[r]+'</span>'
      +'<div class="set-divider-line"></div></div>';

    for(var mi=0;mi<round.length;mi++){
      out+=tMatchCardHtml(r,mi);

    +'<button class="btn dan" data-a="tReset" style="flex:1">🔄 초기화</button>'
    +'</div>';
  return out;

// 라운드 이름 (결승/4강/8강...)
function tRoundNames(n){
  // n=라운드 수. 마지막이 결승
  var names=[];
  var labels=['결승','준결승(4강)','8강','16강','32강'];
  for(var r=0;r<n;r++){
    var fromEnd=n-1-r; // 0이면 결승
    names.push(labels[fromEnd]||( (n-r)+'라운드'));
  }
  return names;
}
// 경기 카드
function tMatchCardHtml(r,mi){
  var m=S.tBracket[r][mi];
  var t1=m.t1, t2=m.t2;
  var isBye=m.bye;
  var wId=m.winner?m.winner.id:null;

  function side(t,which){
    if(!t) return '<div style="flex:1;padding:10px 12px;color:var(--muted);font-size:13px;text-align:'+(which==='t1'?'left':'right')+'">'+(isBye?'부전승':'대기 중')+'</div>';
    var isW=(wId===t.id);
    var canPick=t1&&t2&&!isBye;
    var bg=isW?'var(--lime)':'transparent';
    var col=isW?'var(--accent-ink)':'var(--white)';
    var scoreKey=which==='t1'?'score1':'score2';
    var scoreVal=m[scoreKey]||'';
    return '<div style="flex:1;display:flex;flex-direction:column;gap:4px;align-items:'+(which==='t1'?'flex-start':'flex-end')+'">'
      +'<div '+(canPick?'data-a="tWin" data-r="'+r+'" data-m="'+mi+'" data-w="'+which+'"':'')+' style="'+(canPick?'cursor:pointer;':'')+'background:'+bg+';color:'+col+';border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px;'+(isW?'':'border:1px solid var(--border)')+'">'+tTeamName(t)+(isW?' 👑':'')+'</div>'
      +(canPick?'<input class="t-score" data-a="tScore" data-r="'+r+'" data-m="'+mi+'" data-s="'+which+'" type="number" inputmode="numeric" placeholder="점수" value="'+scoreVal+'" style="width:64px;padding:3px 6px;border-radius:6px;background:var(--input-bg);border:1px solid var(--border);color:var(--white);font-size:12px;text-align:center;outline:none">':'')
      +'</div>';
  }
  var cc=TC[mi%TC.length];
  return '<div class="mcard" style="border-left:3px solid '+cc+';margin-bottom:8px">'
    +'<div style="padding:10px 12px;display:flex;align-items:center;gap:8px">'
      +side(t1,'t1')
      +'<div style="font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0">VS</div>'
      +side(t2,'t2')
    +'</div>'
    +'</div>';
}

    +'<div class="app-header">'

    reni.addEventListener('input',function(e){if(!_composing)S.rEditName=e.target.value;});

  if(inpNg){inpNg.addEventListener('input',function(e){S.numGames=parseInt(e.target.value)||0;});}

  var mScoreEls=document.querySelectorAll('.m-score');
  for(var msi=0;msi<mScoreEls.length;msi++){

      el.addEventListener('input',function(){
        var id=parseInt(el.getAttribute('data-id'),10),s=el.getAttribute('data-s');
        for(var i=0;i<S.matches.length;i++){
          if(S.matches[i].id!==id) continue;
          if(s==='1') S.matches[i].s1=el.value; else S.matches[i].s2=el.value;
          break;
        }
        refreshMatchCard(id);
        fbSaveSession();
      });
      el.addEventListener('keydown',function(e){if(e.key==='Enter')el.blur();});
    })(mScoreEls[msi]);
  }

  // 대진 조정: 드래그 앤 드롭 (PC용, 폰은 탭으로 처리)
  var swapEls=document.querySelectorAll('.pswap');
  for(var si=0;si<swapEls.length;si++){
    (function(el){
      el.addEventListener('dragstart',function(e){
        e.dataTransfer.setData('text/plain',el.getAttribute('data-drag'));
        el.style.opacity='0.4';
      });
      el.addEventListener('dragend',function(){el.style.opacity='';});
      el.addEventListener('dragover',function(e){e.preventDefault();el.style.outline='2px dashed var(--lime)';});
      el.addEventListener('dragleave',function(){el.style.outline='';});
      el.addEventListener('drop',function(e){
        e.preventDefault();el.style.outline='';
        var from=e.dataTransfer.getData('text/plain');
        var to=el.getAttribute('data-drag');
        act('swapDo',{from:from,to:to});
      });
    })(swapEls[si]);
  }
}

// ══════════════════════════════════════════════════════════════════
// 액션
// ══════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
// 토너먼트 로직
// ══════════════════════════════════════════════════════════════════
function getTSelected(){
  return S.roster.filter(function(p){return S.tSelected[p.name];});
}
// 참석자로 2인 팀 랜덤 구성 (홀수면 마지막 1명은 제외 안내)
function tMakeTeams(){
  var ps=shuf(getTSelected());
  var teams=[],id=0;
  for(var i=0;i+1<ps.length;i+=2){
    teams.push({id:id++,p1:ps[i],p2:ps[i+1]});
  }
  S.tTeams=teams;
}
// 팀 이름 헬퍼
function tTeamName(t){return t?(t.p1.name+'·'+t.p2.name):'';}
// 2의 거듭제곱으로 올림 (브래킷 크기)
function nextPow2(n){var p=1;while(p<n)p*=2;return p;}
// 브래킷 생성: 부전승(bye) 포함. 팀 수가 2^k가 아니면 일부 팀이 1라운드 부전승
function tBuildBracket(){
  var teams=S.tTeams.slice();
  if(teams.length<2){S.tBracket=[];return;}
  var size=nextPow2(teams.length);
  var byes=size-teams.length; // 부전승 수
  // 슬롯 배치: 부전승이 서로 다른 경기에 분산되도록
  // 각 경기(2슬롯)에 팀을 채우되, 부전승 받을 팀은 상대 자리를 비움(null)
  // 방식: 시드가 높은(앞) byes팀이 1라운드 부전승 → [팀, null] 형태로 앞쪽 경기에 배치
  var numMatches=size/2;
  var slots=new Array(size).fill(undefined);
  var ti=0;
  // 앞에서부터 각 경기: 부전승이 남아있으면 이 경기를 [팀, bye]로
  for(var mi2=0;mi2<numMatches;mi2++){
    if(mi2<byes){
      // 부전승 경기: 팀 한 명만
      slots[mi2*2]=teams[ti++];
      slots[mi2*2+1]=null; // bye
    } else {
      // 정상 경기: 팀 둘
      slots[mi2*2]=teams[ti++];
      slots[mi2*2+1]=teams[ti++];
    }
  }

  // 1라운드 경기 구성 (size/2 경기)
  var round1=[];
  var mid=0;
  for(var i=0;i<size;i+=2){
    var a=slots[i], b=slots[i+1];
    var m={id:'r0m'+(mid++), t1:a, t2:b, winner:null, score1:'', score2:''};
    // 한쪽이 bye면 자동 진출
    if(a&&!b){m.winner=a; m.bye=true;}
    else if(!a&&b){m.winner=b; m.bye=true;}
    round1.push(m);
  }
  var bracket=[round1];
  // 이후 라운드 빈 경기 생성
  var cnt=round1.length;
  var r=1;
  while(cnt>1){
    var round=[];
    for(var i=0;i<cnt/2;i++){
      round.push({id:'r'+r+'m'+i, t1:null, t2:null, winner:null, score1:'', score2:''});
    }
    bracket.push(round);
    cnt=cnt/2;
    r++;
  }
  // 부전승으로 이미 정해진 승자를 다음 라운드로 전파
  S.tBracket=bracket;
  tPropagateAll();
}
// 특정 경기의 승자를 다음 라운드 자리로 올림
function tAdvance(roundIdx,matchIdx){
  if(roundIdx+1>=S.tBracket.length) return; // 결승이면 끝
  var m=S.tBracket[roundIdx][matchIdx];
  var next=S.tBracket[roundIdx+1][Math.floor(matchIdx/2)];
  if(matchIdx%2===0) next.t1=m.winner;
  else next.t2=m.winner;
}
// 전체 브래킷에서 확정된 승자들을 다음 라운드로 전파
function tPropagateAll(){
  for(var r=0;r<S.tBracket.length-1;r++){
    for(var mi=0;mi<S.tBracket[r].length;mi++){
      var m=S.tBracket[r][mi];
      if(m.winner) tAdvance(r,mi);
    }
  }
}
// 승자 지정 (팀 선택)
function tPickWinner(roundIdx,matchIdx,which){
  var m=S.tBracket[roundIdx][matchIdx];
  if(!m.t1||!m.t2) return; // 상대가 아직 없으면 무시
  var w=which==='t1'?m.t1:m.t2;
  // 이미 같은 팀이 승자면 취소 (토글)
  if(m.winner&&m.winner.id===w.id){
    m.winner=null;
  } else {
    m.winner=w;
  }
  // 승자 바뀌면 이후 라운드 자리 다시 계산 (하위 경기 결과 초기화)
  tResetDownstream(roundIdx,matchIdx);
  tPropagateAll();
}
// 승자 변경 시, 그 이후 라운드에서 이 경기로부터 온 팀 자리 비우기
function tResetDownstream(roundIdx,matchIdx){
  var r=roundIdx+1, mi=Math.floor(matchIdx/2), slot=(matchIdx%2===0)?'t1':'t2';
  while(r<S.tBracket.length){
    var m=S.tBracket[r][mi];
    var removed=m[slot];
    m[slot]=null;
    // 이 경기 승자였다면 승자·점수도 리셋하고 계속 아래로
    if(m.winner&&removed&&m.winner.id===removed.id){ m.winner=null; }
    m.score1='';m.score2='';
    slot=(mi%2===0)?'t1':'t2';
    mi=Math.floor(mi/2);
    r++;
  }
}

// 토너먼트 팀 선수 맞바꾸기 (키='T팀id_자리')
function tDoSwap(keyA,keyB){
  var a=keyA.replace('T','').split('_'), b=keyB.replace('T','').split('_');
  var tidA=parseInt(a[0]), slotA=a[1], tidB=parseInt(b[0]), slotB=b[1];
  var teamA=null,teamB=null;
  for(var i=0;i<S.tTeams.length;i++){
    if(S.tTeams[i].id===tidA) teamA=S.tTeams[i];
    if(S.tTeams[i].id===tidB) teamB=S.tTeams[i];
  }
  if(!teamA||!teamB) return;
  var tmp=teamA[slotA]; teamA[slotA]=teamB[slotB]; teamB[slotB]=tmp;
}

// 대진 조정: 두 선수(키='팀id_자리') 맞바꾸기
function doSwap(keyA,keyB){
  var a=keyA.split('_'), b=keyB.split('_');
  var tidA=parseInt(a[0]), slotA=a[1];
  var tidB=parseInt(b[0]), slotB=b[1];
  var teamA=null, teamB=null;
  for(var i=0;i<S.teams.length;i++){
    if(S.teams[i].id===tidA) teamA=S.teams[i];
    if(S.teams[i].id===tidB) teamB=S.teams[i];
  }
  if(!teamA||!teamB) return;
  // 같은 팀 안에서 두 자리 교환도 허용
  var tmp=teamA[slotA];
  teamA[slotA]=teamB[slotB];
  teamB[slotB]=tmp;
}

function act(a,d){
  d=d||{};

  // ── 공통 ──────────────────────────────────────────────────────
  if(a==='gotab'){S.tab=d.v;render();}
  else if(a==='toggleGuide'){S.showGuide=!S.showGuide;render();}
  else if(a==='thm'){S.theme=S.theme==='dark'?'light':'dark';document.body.classList.toggle('light',S.theme==='light');lsSave();render();}
  else if(a==='shr'){shareApp();}

  // ── 명단 관리 ─────────────────────────────────────────────────
  else if(a==='rag'){S.rAddGender=d.v;render();}
  else if(a==='ral'){S.rAddLevel=d.v;render();}
  else if(a==='rtgi'){S.rShowGrade=!S.rShowGrade;render();}
  else if(a==='radd'){
    var n=S.rAddName.trim(),dup=false;
    for(var i=0;i<S.roster.length;i++)if(S.roster[i].name===n){dup=true;break;}
    if(!n||dup)return;
    S.roster.push({name:n,gender:S.rAddGender,level:S.rAddLevel});
    S.rAddName='';fbSaveRoster();
  }
  else if(a==='rmp'){
    var idx=parseInt(d.i);
    var name=S.roster[idx].name;
    if(!confirm('"'+name+'" 님을 명단에서 삭제할까요?')) return;
    delete S.selected[name];
    S.roster.splice(idx,1);
    if(S.rEditIdx===idx)S.rEditIdx=-1;
    fbSaveRoster();
  }
  else if(a==='rtogsel'){
    S.rSelectMode=!S.rSelectMode;
    if(!S.rSelectMode) S.rSelected={};
    render();
  }
  else if(a==='rtogitem'){
    var n=d.n;
    S.rSelected[n]=!S.rSelected[n];
    render();
  }
  else if(a==='rdelsel'){
    var names=Object.keys(S.rSelected).filter(function(k){return S.rSelected[k];});
    if(names.length===0) return;
    if(!confirm(names.length+'명을 명단에서 삭제할까요?\n('+names.join(', ')+')')) return;
    for(var i=0;i<names.length;i++){
      delete S.selected[names[i]];
      S.roster=S.roster.filter(function(p){return p.name!==names[i];});
    }
    S.rSelected={};S.rSelectMode=false;
    fbSaveRoster();
  }
  else if(a==='redp'){var i=parseInt(d.i),p=S.roster[i];S.rEditIdx=i;S.rEditName=p.name;S.rEditGender=p.gender||'남';S.rEditLevel=p.level;render();}
  else if(a==='resg'){S.rEditGender=d.v;render();}
  else if(a==='resl'){S.rEditLevel=d.v;render();}
  else if(a==='resv'){
    var i=parseInt(d.i);
    var reniEl=document.getElementById('reni');
    var newName=reniEl?reniEl.value.trim():S.rEditName.trim();
    if(!newName)return;
    var dup=false;for(var j=0;j<S.roster.length;j++)if(j!==i&&S.roster[j].name===newName){dup=true;break;}
    if(dup){toast('이미 있는 이름이에요');return;}
    var oldName=S.roster[i].name;
    if(S.selected[oldName]){delete S.selected[oldName];S.selected[newName]=true;}
    S.roster[i]={name:newName,gender:S.rEditGender,level:S.rEditLevel};
    S.rEditIdx=-1;fbSaveRoster();
  }
  else if(a==='recx'){S.rEditIdx=-1;render();}
  else if(a==='rclr'){if(!confirm('전체 명단을 삭제할까요?'))return;S.roster=[];S.selected={};fbSaveRoster();}

  // ── 참석자 선택 ───────────────────────────────────────────────
  else if(a==='rsrchclr'){S.rSearch='';render();}
  else if(a==='selfiltered'){
    var q2=(S.attendSearch||'').trim().toLowerCase();
    S.roster.filter(function(p){return p.name.toLowerCase().indexOf(q2)!==-1;}).forEach(function(p){
      S.selected[p.name]=true;
      if(!S.playerGroups[p.name])S.playerGroups[p.name]=1;
    });
    render();
  }
  else if(a==='tog'){
    var n=d.n;
    S.selected[n]=!S.selected[n];
    render();
  }
  else if(a==='attendToggle'){
    var n=d.n;
    S.selected[n]=!S.selected[n];
    if(!S.selected[n]) delete S.lateArrivals[n];
    renderAttendList();
    render();
  }
  else if(a==='togglelate'){
    if(S.lateArrivals[d.n]) delete S.lateArrivals[d.n];
    else S.lateArrivals[d.n]=true;
    render();
  }
  else if(a==='setnc'){S.numCourts=parseInt(d.v);render();}
  else if(a==='setgames'){S.numGames=parseInt(d.v);render();}
  else if(a==='ipMatch'){
    var mid=parseInt(d.id);
    for(var i=0;i<S.matches.length;i++) if(S.matches[i].id===mid){S.matches[i].inProgress=true;break;}
    fbSaveSession();render();
  }
  else if(a==='doneMatch'){
    var mid=parseInt(d.id);
    for(var i=0;i<S.matches.length;i++) if(S.matches[i].id===mid){S.matches[i].done=true;S.matches[i].inProgress=false;break;}
    fbSaveSession();render();
  }
  else if(a==='delMatch'){
    var mid=parseInt(d.id);
    S.matches=S.matches.filter(function(m){return m.id!==mid;});
    fbSaveSession();render();
  }
  else if(a==='swapCancel'){
    S.swapSel=null;
    render();
  }
  // ── 토너먼트 액션 ──
  else if(a==='tToggle'){
    var n=d.n; S.tSelected[n]=!S.tSelected[n]; render();
  }
  else if(a==='tselall'){
    if(d.v==='all'){for(var i=0;i<S.roster.length;i++)S.tSelected[S.roster[i].name]=true;}
    else S.tSelected={};
    render();
  }
  else if(a==='tsrchclr'){S.tSearch='';render();}
  else if(a==='tMakeTeams'){
    tMakeTeams();
    fbSaveSession();render();
  }
  else if(a==='tSwapPick'){
    var key=d.k;
    if(!key) return;
    if(!S.swapSel){ S.swapSel=key; }
    else if(S.swapSel===key){ S.swapSel=null; }
    else { tDoSwap(S.swapSel,key); S.swapSel=null; fbSaveSession(); }
    render();
  }
  else if(a==='tStartBracket'){
    tBuildBracket();
    S.tStep=2; S.swapSel=null;
    fbSaveSession();render();
  }
  else if(a==='tBack1'){ S.tStep=1; render(); }
  else if(a==='tWin'){
    tPickWinner(parseInt(d.r),parseInt(d.m),d.w);
    fbSaveSession();render();
  }
  else if(a==='tReset'){
    if(!confirm('토너먼트를 초기화할까요? (팀은 유지돼요)')) return;
    tBuildBracket(); // 브래킷만 새로
    fbSaveSession();render();
  }
  else if(a==='swapPick'){
    var key=d.k;
    if(!key) return;
    if(!S.swapSel){
      // 첫 번째 선수 선택
      S.swapSel=key;
    } else if(S.swapSel===key){
      // 같은 사람 다시 누르면 선택 취소
      S.swapSel=null;
    } else {
      // 두 번째 선수 → 맞바꾸기
      doSwap(S.swapSel,key);
      S.swapSel=null;
      fbSaveSession();
    }
    render();
  }
  else if(a==='swapDo'){
    // 드래그 앤 드롭: d.from → d.to
    if(d.from&&d.to&&d.from!==d.to){
      doSwap(d.from,d.to);
      S.swapSel=null;
      fbSaveSession();render();
    }
  }
  else if(a==='arriveLate'){
    var ln=d.n;
    if(!ln) return;
    delete S.lateArrivals[ln];
    var keptMatches=S.matches.filter(function(m){return m.done||m.inProgress;});
    var maxBlock=0;
    for(var i=0;i<keptMatches.length;i++) if(keptMatches[i].blockNum>maxBlock) maxBlock=keptMatches[i].blockNum;
    var keptIds={};
    for(var i=0;i<keptMatches.length;i++){keptIds[keptMatches[i].t1]=true;keptIds[keptMatches[i].t2]=true;}
    var keptTeams=[];
    for(var i=0;i<S.teams.length;i++) if(keptIds[S.teams[i].id]) keptTeams.push(S.teams[i]);
    var remainSets=Math.max(1,S.numGames-maxBlock);
    var origGames=S.numGames;
    S.numGames=remainSets;
    var rot=mkRotationSchedule();
    S.numGames=origGames;
    var tidOff=keptTeams.length>0?Math.max.apply(null,keptTeams.map(function(t){return t.id;}))+1:0;
    var midOff=keptMatches.length>0?Math.max.apply(null,keptMatches.map(function(m){return m.id;}))+1:0;
    for(var i=0;i<rot.teams.length;i++) rot.teams[i].id+=tidOff;
    for(var i=0;i<rot.matches.length;i++){rot.matches[i].id+=midOff;rot.matches[i].t1+=tidOff;rot.matches[i].t2+=tidOff;rot.matches[i].blockNum+=maxBlock;}
    for(var i=0;i<rot.blockInfo.length;i++) rot.blockInfo[i].blockNum+=maxBlock;
    S.teams=keptTeams.concat(rot.teams);
    S.matches=keptMatches.concat(rot.matches);
    S.blockInfo=S.blockInfo.filter(function(b){return b.blockNum<=maxBlock;}).concat(rot.blockInfo);
    fbSaveSession();render();
    toast('✅ '+ln+' 도착! 남은 '+remainSets+'게임에 반영됐어요');
  }
  else if(a==='grpall'){
    var gv=parseInt(d.v);
    for(var k in S.selected){if(S.selected[k])S.playerGroups[k]=gv;}
    render();
  }
  else if(a==='selall'){
    var all=d.v==='all';
    for(var i=0;i<S.roster.length;i++)S.selected[S.roster[i].name]=all;
    render();
  }

  // ── 매치 흐름 ─────────────────────────────────────────────────
  else if(a==='mg1'){S.mStep=1;render();}
  else if(a==='mg2'){
    if(S.numCourts<1){toast('⚠️ 코트 수를 입력해주세요!');return;}
    if(S.numGames<1){toast('⚠️ 게임 수를 입력해주세요!');return;}
    S.matches=[];S.teams=[];S.blockInfo=[];S.statsSaved=false;S.mStep=2;render();
  }
  else if(a==='sm'){S.pairMode=d.v;render();}
  else if(a==='setgm'){S.groupMode=d.v;render();}
  else if(a==='mmode'){S.matchMode=d.v;render();}
  else if(a==='genmatches'||a==='rsf'){
    if(S.numCourts<1){toast('⚠️ 코트 수를 입력해주세요!');return;}
    if(S.numGames<1){toast('⚠️ 게임 수를 입력해주세요!');return;}
    doTeams();
    if(S.matchMode==='rotation'){
      var rot=mkRotationSchedule();S.teams=rot.teams;S.matches=rot.matches;S.blockInfo=rot.blockInfo;
    } else {
      S.matches=mkMatches(S.teams);S.blockInfo=[];
    }
    S.statsSaved=false; // 대진표를 새로 만들면 점수도 초기화되므로 다시 반영 가능
    S.setupOpen=false;  // 좁은 화면에서 바로 대진표가 보이도록 설정은 접는다
    S.mStep=2;fbSaveSession();render();
  }
  else if(a==='mg3'){S.mStep=2;render();}
  else if(a==='mg2b'){S.mStep=2;render();}
  else if(a==='mg4'){S.mStep=3;S.swapSel=null;render();}
  else if(a==='mgoto'){
    var st=parseInt(d.v,10);
    if(st!==1&&S.matches.length===0){toast('먼저 대진표를 만들어 주세요');return;}
    S.mStep=st;S.swapSel=null;render();
  }
  else if(a==='recview'){S.recView=d.v;render();}
  else if(a==='togfair'){S.showFair=!S.showFair;render();}
  else if(a==='togsetup'){S.setupOpen=!S.setupOpen;render();}
  else if(a==='savecareer'){saveCareer();}
  else if(a==='clearcareer'){
    if(!confirm('누적 전적을 전부 삭제할까요?\n(되돌릴 수 없어요)')) return;
    S.career={};
    fbSaveStats();render();
    toast('누적 전적을 초기화했어요');
  }
  else if(a==='lim'){render();}
  else if(a==='ngmclr'){S.numGames=0;render();}
  else if(a==='saveimg'){generateResultImage();}
  else if(a==='print'){printSchedule();}
  else if(a==='cpr'){copyResults();}
  else if(a==='nr'){
    if(S.standby){S.restCount[S.standby.name]=(S.restCount[S.standby.name]||0)+1;}
    for(var i=0;i<S.teams.length;i++){var k=pk(S.teams[i].p1,S.teams[i].p2),found=false;for(var j=0;j<S.history.length;j++)if(S.history[j]===k){found=true;break;}if(!found)S.history.push(k);}
    S.round++;doTeams();
    if(S.matchMode==='rotation'){
      var rot=mkRotationSchedule();S.teams=rot.teams;S.matches=rot.matches;S.blockInfo=rot.blockInfo;
    } else {
      S.matches=mkMatches(S.teams);S.blockInfo=[];
    }
    S.statsSaved=false;S.setupOpen=false;
    S.mStep=2;fbSaveSession();render();
  }
  else if(a==='rst'){
    S.standby=null;S.teams=[];S.matches=[];S.pairMode='random';
    S.history=[];S.round=1;S.dup=false;S.numGames=0;S.numCourts=1;S.matchMode='rotation';S.numRotations=10;S.groups={};S.groupNames=['1그룹','2그룹'];S.playerGroups={};S.restCount={};S.blockInfo=[];S.attendSearch='';S.groupMode='any';S.lateArrivals={};
    S.statsSaved=false;S.recView='today';S.setupOpen=false;S.showFair=false; // 누적 전적(S.career)은 유지
    S.mStep=1;
    if(db) db.ref('session').remove(); // Firebase에서 세션 삭제
    render();
  }
}

// ── 클릭 이벤트 ──────────────────────────────────────────────────
document.addEventListener('click',function(e){
  // 가장 가까운 data-a 요소부터 처리 (pgrp 버튼이 tog 보다 우선)
  var el=e.target.closest('[data-a]');
  if(!el||el.disabled)return;
  // pgrp 버튼 클릭 시 부모 attend-item(tog)으로 전파 방지
  if(el.dataset.a==='pgrp'||el.dataset.a==='grpall'||el.dataset.a==='togglelate'||el.dataset.a==='setnc'||el.dataset.a==='setgames'||el.dataset.a==='arriveLate'||el.dataset.a==='rtogitem'||el.dataset.a==='rtogsel'||el.dataset.a==='rdelsel'||el.dataset.a==='doneMatch'||el.dataset.a==='delMatch'||el.dataset.a==='tScore'||el.dataset.a==='tWin'){
    e.stopPropagation();
  }
  act(el.dataset.a,el.dataset);
});

// ── 시작 ─────────────────────────────────────────────────────────
lsLoad(); // 테마 + 로컬 명단 로드
document.body.classList.toggle('light',S.theme==='light');
render();
loadFirebase(); // Firebase 동적 로드 → 연결 후 자동 re-render
</script>
