<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f6f8f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="피카츄의 배드민턴매치">
<title>⚡ 피카츄의 배드민턴매치</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   디자인 토큰
   코트 옆에 서서 한 손으로 보는 화면이다. 큰 글자, 높은 대비, 큰 버튼.
   기존 코드 곳곳의 인라인 스타일이 --lime/--white/--muted 등을 쓰고 있어
   변수 이름은 그대로 두고 값만 새 팔레트에 연결한다.
   ══════════════════════════════════════════════════════════════════ */
body {
  /* 어두운 체육관 · 야간 */
  --paper:#0B1210; --paper-2:#0E1714;
  --surface:#141E19; --surface-2:#1B2721;
  --ink-1:#E8EFEA; --ink-2:#9DACA4; --ink-3:#74847C;
  --line-1:#26332C; --line-2:#1B2721;
  --court:#3ED181; --court-ink:#08130D; --court-soft:rgba(62,209,129,.15);
  --shuttle:#F5B33C; --shuttle-soft:rgba(245,179,60,.15);
  --flag:#FF6B61;    --flag-soft:rgba(255,107,97,.15);
  --net:rgba(232,239,234,.22);
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 4px 20px rgba(0,0,0,.45);
  --ring:rgba(62,209,129,.3);
}
body.light {
  /* 형광등 밝은 체육관 — 기본 */
  --paper:#F6F8F6; --paper-2:#EDF1EE;
  --surface:#FFFFFF; --surface-2:#F2F5F2;
  --ink-1:#0F1714; --ink-2:#46524C; --ink-3:#6B7A73;
  --line-1:#DFE6E1; --line-2:#EDF1EE;
  --court:#0E7C4A; --court-ink:#FFFFFF; --court-soft:#E4F3EA;
  --shuttle:#B26A00; --shuttle-soft:#FBF0DC;
  --flag:#C4362E;    --flag-soft:#FBE8E6;
  --net:rgba(15,23,20,.18);
  --shadow-1:0 1px 2px rgba(15,23,20,.05);
  --shadow-2:0 6px 24px rgba(15,23,20,.09);
  --ring:rgba(14,124,74,.22);
}
/* 예전 변수명 → 새 팔레트 (인라인 스타일 호환) */
body{
  --bg:var(--paper); --bg2:var(--paper-2);
  --white:var(--ink-1); --muted:var(--ink-2);
  --card:var(--surface); --border:var(--line-1);
  --warn:var(--shuttle); --red:var(--flag);
  --lime:var(--court); --lime-soft:var(--court-soft);
  --input-bg:var(--surface); --fbox-bg:var(--surface-2);
  --chip-bg:var(--surface-2); --mode-bg:var(--surface);
  --shadow:var(--shadow-1); --tab-active:var(--court-soft);
  --accent-ink:var(--court-ink);
  /* 타이포 — 12px가 하한 (체육관에서 읽히는 최소 크기) */
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px;
  --fs-xl:21px; --fs-2xl:27px;
  --r-s:10px; --r-m:14px; --r-l:18px; --r-xl:24px;
  --tap:44px;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
    'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-num:'Bricolage Grotesque',var(--font);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--paper);font-family:var(--font);color:var(--ink-1);
  min-height:100vh;overscroll-behavior-y:none;
  font-size:var(--fs-md);line-height:1.5;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease}
button,input{font-family:inherit;-webkit-appearance:none;appearance:none;border:none;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--court);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-1);border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

#app{min-height:100vh;padding:0 0 max(28px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 16px}
@media(min-width:760px){ .wrap{padding:0 24px} }
.content{padding:0}

/* ── 상단 헤더 ── */
.app-header{display:flex;align-items:center;gap:10px;padding:14px 0 12px;position:relative}
.app-mark{font-size:20px;line-height:1;flex-shrink:0}
.app-title{font-weight:800;font-size:var(--fs-lg);letter-spacing:-.035em;
  color:var(--ink-1);white-space:nowrap}
.app-sub{display:none;font-size:var(--fs-xs);color:var(--ink-3)}
@media(min-width:760px){
  .app-header{padding:20px 0 16px;gap:12px}
  .app-title{font-size:var(--fs-xl)}
  .app-sub{display:block}
}
.theme-btn{margin-left:auto;flex-shrink:0;width:var(--tap);height:var(--tap);
  border-radius:50%;background:var(--surface);border:1px solid var(--line-1);
  font-size:16px;color:var(--ink-2);box-shadow:var(--shadow-1);
  display:flex;align-items:center;justify-content:center;transition:border-color .15s}
.theme-btn:hover{border-color:var(--court)}

/* ── 탭 ── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-1);margin-bottom:20px}
.tab{flex:1;padding:12px 4px;min-height:var(--tap);text-align:center;
  font-weight:700;font-size:var(--fs-sm);color:var(--ink-3);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;
  transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink-2)}
.tab.active{color:var(--court);border-bottom-color:var(--court)}
@media(min-width:760px){ .tab{font-size:var(--fs-md);padding:14px 8px} }

/* ── 스텝바 ── */
.sbar{display:flex;align-items:flex-start;justify-content:center;margin-bottom:18px}
.sdot-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:4px 8px;border-radius:var(--r-s);transition:background .15s}
.sdot-wrap[data-a]:hover{background:var(--surface-2)}
.sdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:var(--fs-xs);transition:all .2s}
.sdot.done,.sdot.active{background:var(--court);border:2px solid var(--court);color:var(--court-ink)}
.sdot.idle{background:transparent;border:2px solid var(--line-1);color:var(--ink-3)}
.slabel{font-size:var(--fs-xs);font-weight:600}
.slabel.active{color:var(--court);font-weight:800}
.slabel.idle{color:var(--ink-3)}
.sline{width:34px;height:2px;margin:14px 2px 0;border-radius:2px}
.sline.done{background:var(--court)}
.sline.idle{background:var(--line-1)}

/* ── 카드 ── */
.card{background:var(--surface);border:1px solid var(--line-1);
  border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow-1);margin-bottom:14px}
@media(min-width:760px){ .card{padding:24px} }
.ttl{font-weight:800;font-size:var(--fs-2xl);letter-spacing:-.035em;
  margin-bottom:4px;color:var(--ink-1)}
.sub{color:var(--ink-2);font-size:var(--fs-sm);margin-bottom:14px}
.lbl{font-size:var(--fs-xs);font-weight:700;color:var(--ink-3);margin-bottom:7px}

/* ── 매치 화면 레이아웃 ──
   넓은 화면에서는 설정을 왼쪽 레일로 보내고 대진표를 주인공으로 올린다 */
.m-layout{display:grid;gap:16px}
@media(min-width:1080px){
  .m-layout{grid-template-columns:348px minmax(0,1fr);gap:22px;align-items:start}
  .m-rail{position:sticky;top:16px;max-height:calc(100vh - 32px);
    overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
}
.m-main{min-width:0}

/* 설정 접기 — 대진표가 생기면 좁은 화면에서는 접어두고
   대진표를 첫 화면에 올린다. 넓은 화면은 레일이 옆에 있으므로 항상 펼침 */
.rail-toggle{display:flex;align-items:center;gap:8px;width:100%;
  padding:12px 2px;min-height:var(--tap);font-weight:800;font-size:var(--fs-md);
  color:var(--ink-1);text-align:left}
.rail-toggle .rt-sum{margin-left:auto;font-size:var(--fs-xs);font-weight:600;color:var(--ink-3)}
.rail-body.closed{display:none}
.rail-title{display:none}
@media(min-width:1080px){
  .rail-toggle{display:none}
  .rail-body.closed{display:block}
  .rail-title{display:block}
}

/* ── 뱃지/태그 ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;
  font-size:var(--fs-xs);font-weight:800;letter-spacing:-.01em}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:var(--fs-xs);font-weight:700}

/* ── 버튼 ── */
.btn{padding:12px 18px;border-radius:var(--r-m);font-weight:700;
  font-size:var(--fs-md);min-height:var(--tap);
  transition:transform .12s,background .15s,border-color .15s,box-shadow .15s,color .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--court);color:var(--court-ink);box-shadow:var(--shadow-1)}
.btn.pri:hover{box-shadow:0 4px 14px var(--ring)}
.btn.pri:active{transform:translateY(1px)}
.btn.gho{background:var(--surface);border:1px solid var(--line-1);color:var(--ink-1)}
.btn.gho:hover{border-color:var(--court);color:var(--court)}
.btn.gho:active{transform:translateY(1px)}
.btn.suc{background:var(--court-soft);border:1px solid transparent;color:var(--court)}
.btn.suc:hover{border-color:var(--court)}
.btn.dan{background:var(--flag-soft);border:1px solid transparent;color:var(--flag)}
.btn.dan:hover{border-color:var(--flag)}
.btn:disabled{opacity:.4;pointer-events:none}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.brow>.btn{flex:1 1 130px}

/* ── 입력 ── */
.inp{width:100%;padding:12px 14px;border-radius:var(--r-m);background:var(--surface);
  border:1.5px solid var(--line-1);color:var(--ink-1);font-size:var(--fs-md);
  font-weight:600;min-height:var(--tap);outline:none;
  transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:var(--ink-3);font-weight:500}
.inp:focus{border-color:var(--court);box-shadow:0 0 0 3px var(--ring)}
.inp.err{border-color:var(--flag)}
.err-txt{font-size:var(--fs-xs);color:var(--flag);margin-top:4px;font-weight:600}

/* ── 등급 토글 ── */
.lv-group{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.lv-btn{padding:9px 0;border-radius:var(--r-s);font-weight:800;font-size:var(--fs-sm);
  min-height:40px;transition:all .15s;border:1px solid transparent}
.g-group{display:flex;gap:6px}
.g-btn{flex:1;padding:10px 0;border-radius:var(--r-m);font-weight:700;
  font-size:var(--fs-md);min-height:var(--tap);transition:all .15s;border:1px solid transparent}

/* ── 명단 ── */
.roster-item{display:flex;align-items:center;gap:10px;padding:11px 13px;
  border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line-1);
  margin-bottom:7px;min-height:56px;transition:border-color .15s,background .15s}
.roster-item:hover{background:var(--surface-2)}
.roster-item.editing{background:var(--surface-2);border-color:var(--court)}
.roster-num{width:24px;height:24px;border-radius:7px;background:var(--surface-2);
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-xs);font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.roster-info{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.roster-name{font-weight:700;font-size:var(--fs-md)}
.roster-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{background:transparent;padding:0;width:38px;height:38px;border-radius:var(--r-s);
  font-size:15px;color:var(--ink-3);border:1px solid var(--line-1);
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{border-color:var(--court);color:var(--court)}
.edit-form{display:flex;flex-direction:column;gap:8px;flex:1}

/* ── 참석자 선택 ── */
.attend-item{display:flex;align-items:center;gap:11px;padding:11px 13px;
  border-radius:var(--r-m);background:var(--surface);border:1.5px solid var(--line-1);
  margin-bottom:7px;min-height:58px;transition:all .15s;cursor:pointer}
.attend-item:hover{border-color:var(--ink-3)}
.attend-item.selected{background:var(--court-soft);border-color:var(--court)}
.attend-item.standby-mark{border-color:var(--shuttle);background:var(--shuttle-soft)}
.chk-box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-1);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .15s;font-size:14px}
.chk-box.on{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.attend-info{flex:1;min-width:0}
.attend-name{font-weight:700;font-size:var(--fs-md);margin-bottom:3px}
.attend-badges{display:flex;gap:4px;flex-wrap:wrap}
/* 넓은 화면에서 한 줄이 너무 길어지지 않게 */
.attend-grid{display:grid;gap:7px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.attend-grid .attend-item{margin-bottom:0}
.narrow{max-width:700px;margin-left:auto;margin-right:auto}
.num-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px}

.select-bar{display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:10px}
.select-count{font-size:var(--fs-sm);color:var(--ink-2);font-weight:600}
.select-all-btn{font-size:var(--fs-sm);font-weight:700;color:var(--court);
  background:transparent;padding:8px 12px;min-height:38px;border-radius:var(--r-s);
  border:1px solid var(--line-1);transition:all .15s}
.select-all-btn:hover{border-color:var(--court);background:var(--court-soft)}

/* ── 팀 구성 방식 ── */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.mbtn{padding:11px 12px;border-radius:var(--r-m);text-align:left;min-height:58px;
  transition:all .15s;border:1.5px solid var(--line-1);background:var(--surface);
  color:var(--ink-2);width:100%}
.mbtn:hover{border-color:var(--ink-3)}
.mbtn.active{background:var(--court-soft);border-color:var(--court);color:var(--court)}
.mbtn-lbl{font-weight:700;font-size:var(--fs-sm);margin-bottom:2px}
.mbtn-desc{font-size:var(--fs-xs);opacity:.75;font-weight:500}
.tcard{padding:12px 14px;border-radius:var(--r-m);background:var(--surface);
  border:1px solid var(--line-1);margin-bottom:8px}
.tdot{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--court-ink);font-weight:800;
  font-size:var(--fs-xs);flex-shrink:0}
.lgroup{display:flex;gap:6px;margin-bottom:12px}
.lbtn{flex:1;padding:12px 0;border-radius:var(--r-m);font-weight:700;
  font-size:var(--fs-lg);min-height:var(--tap);transition:all .15s;border:1px solid transparent}
.lbtn.active{background:var(--court);color:var(--court-ink)}
.lbtn.idle{background:var(--surface);border:1px solid var(--line-1);color:var(--ink-2)}

/* ══════════════════════════════════════════════════════════════════
   대진표 — 코트 카드
   위에서 내려다본 배드민턴 코트. 가운데 세로 점선이 네트이고,
   점수는 각자 자기 진영 아래에 놓여 누구 점수인지 헷갈리지 않는다.
   ══════════════════════════════════════════════════════════════════ */
.court-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
/* 게임 목록 — 공간이 남으면 게임을 가로로 2개씩 놓는다 (최대 2열).
   --gmin: 게임 하나가 필요한 최소 폭 (코트 수에 따라 JS가 정함) */
.game-list{display:grid;column-gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(max(var(--gmin,300px),calc(50% - 8px)),1fr))}
.game-block{min-width:0}

.mcard{border-radius:var(--r-l);overflow:hidden;background:var(--surface);
  border:1px solid var(--line-1);box-shadow:var(--shadow-1);
  transition:border-color .15s,box-shadow .15s,opacity .2s}
.mcard.live{border-color:var(--shuttle);box-shadow:0 0 0 3px var(--shuttle-soft)}
.mcard.decided{border-color:var(--court)}

.court-top{display:flex;align-items:center;gap:6px;padding:8px 12px;
  border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.court-no{font-weight:800;font-size:var(--fs-xs);display:inline-flex;align-items:center;gap:6px}
.court-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.court-state{margin-left:auto;font-size:var(--fs-xs);font-weight:700;color:var(--ink-3)}
.court-state.live{color:var(--shuttle)}
.court-state.won{color:var(--court)}

/* 코트 바닥 — 가운데 세로 점선이 네트 */
.mbody{position:relative;display:grid;grid-template-columns:1fr 1fr;
  padding:13px 12px 9px;gap:8px}
.mbody::before{content:'';position:absolute;left:50%;top:8px;bottom:0;
  border-left:2px dashed var(--net);transform:translateX(-50%);pointer-events:none}
.mteam{min-width:0;display:flex;flex-direction:column;gap:2px;
  padding:4px 8px 4px 4px;border-radius:var(--r-s);transition:background .2s}
.mteam.r{text-align:right;padding:4px 4px 4px 8px}
.mteam.won{background:var(--court-soft)}
.mname{font-weight:700;font-size:var(--fs-lg);color:var(--ink-1);line-height:1.25;
  letter-spacing:-.025em;word-break:keep-all;overflow-wrap:anywhere;
  min-height:36px;display:flex;align-items:center}
.mteam.r .mname{justify-content:flex-end}
.mteam.won .mname{color:var(--court)}
/* 3게임 이상 연속 출전 중인 게임의 이름은 빨간색 (자리 바꾸려고 고른 이름은 제외) */
.mteam .mname.hot:not(.sel){color:var(--flag)}

/* 네트 위의 점수 — 각 팀 바로 아래 칸 */
.score-row{position:relative;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:6px;padding:4px 12px 11px}
.score-row::before{content:'';position:absolute;left:50%;top:0;bottom:12px;
  border-left:2px dashed var(--net);transform:translateX(-50%);pointer-events:none}
.score-cell{display:flex;justify-content:flex-end}
.score-cell.r{justify-content:flex-start}
.score-in{width:62px;height:46px;border-radius:var(--r-m);background:var(--surface-2);
  border:1.5px solid var(--line-1);color:var(--ink-1);
  font-family:var(--font-num);font-size:var(--fs-xl);font-weight:700;

.rec-num{text-align:center;font-variant-numeric:tabular-nums;

// Firebase 실시간 리스너
function fbListen(){
  db.ref('roster').on('value',function(snap){
    var data=snap.val();
    var roster=[];
    if(data){
      // Firebase는 배열을 객체로 저장할 수 있음 → 변환
      if(Array.isArray(data)){
        roster=data.filter(function(p){return p&&p.name;});
      } else if(typeof data==='object'){
        var keys=Object.keys(data);
        for(var i=0;i<keys.length;i++){
          if(data[keys[i]]&&data[keys[i]].name) roster.push(data[keys[i]]);
        }
      }
    }
    if(roster.length>0){
      S.roster=roster;
      S.roster.sort(function(a,b){return a.name.localeCompare(b.name,'ko');});
      lsRosterSave();
      render();
    } else if(S.roster.length>0){
      // Firebase 비어있고 로컬에 있으면 Firebase에 업로드
      db.ref('roster').set(S.roster);
    }
  });
  db.ref('groupNames').on('value',function(snap){
    var data=snap.val();
    if(data&&Array.isArray(data))S.groupNames=data;
    render();
  });
  // 누적 전적
  db.ref('stats').on('value',function(snap){
    var data=snap.val();
    if(data&&typeof data==='object'&&!Array.isArray(data)){
      S.career=data;
      lsCareerSave();
      render();
    } else if(Object.keys(S.career).length>0){
      // Firebase 비어있고 로컬에 있으면 업로드
      db.ref('stats').set(S.career);
    }
  });
  // 대진표 세션 불러오기 — 물어보고 복구
  db.ref('session').once('value',function(snap){
    var d=snap.val();
    if(!d||!d.teams||!d.teams.length) return;
    // 확인 팝업
    showRestoreDialog(d);
  });
}

// Firebase SDK를 동적으로 로드
function loadFirebase(){
  var urls=[
    ['https://unpkg.com/firebase@8.10.1/firebase-app.js',
     'https://unpkg.com/firebase@8.10.1/firebase-database.js'],
    ['https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-app.min.js',
     'https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-database.min.js'],
    ['https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js',
     'https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js']
  ];
  var idx=0;
  function tryLoad(){
    if(idx>=urls.length){toast('Firebase 연결 불가 — 로컬 모드로 실행');return;}
    var pair=urls[idx++];
    var s1=document.createElement('script');
    s1.src=pair[0];
    s1.onload=function(){
      var s2=document.createElement('script');
      s2.src=pair[1];
      s2.onload=function(){
        try{
          if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db=firebase.database();
          fbListen();
          toast('✅ Firebase 연결됐어요');
        }catch(e){tryLoad();}
      };
      s2.onerror=function(){tryLoad();};
      document.head.appendChild(s2);
    };
    s1.onerror=function(){tryLoad();};
    document.head.appendChild(s1);
  }
  tryLoad();
}

// 유틸
// ══════════════════════════════════════════════════════════════════
function shuf(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}return r;}
function pk(a,b){return[a.name,b.name].sort().join('||');}
function lsc(p){for(var i=0;i<LV.length;i++)if(LV[i].key===p.level)return LV[i].sc;return 0;}
function linfo(k){for(var i=0;i<LV.length;i++)if(LV[i].key===k)return LV[i];return LV[0];}
function hasDup(ts,h){var i,j,key;h=h||S.history;for(i=0;i<ts.length;i++){key=pk(ts[i].p1,ts[i].p2);for(j=0;j<h.length;j++)if(h[j]===key)return true;}return false;}
function pairUp(arr){var t=[];for(var i=0;i<arr.length-1;i+=2)t.push({id:i/2,p1:arr[i],p2:arr[i+1]});return t;}
function getSelected(){
  // 늦참 제외한 참석자
  return S.roster.filter(function(p){return S.selected[p.name]&&!S.lateArrivals[p.name];});
}
function getSelectedAll(){
  // 늦참 포함 전체 참석자
  return S.roster.filter(function(p){return S.selected[p.name];});
}
function getLateArrivals(){
  return S.roster.filter(function(p){return S.selected[p.name]&&S.lateArrivals[p.name];});
}

// 팀 구성 로직
// ══════════════════════════════════════════════════════════════════
function bRandom(ps,h){for(var t=0;t<60;t++){var ts=pairUp(shuf(ps));if(!hasDup(ts,h))return{teams:ts,dup:false};}return{teams:pairUp(shuf(ps)),dup:true};}
function bBal(ps,h){
  // 4명씩 묶어서 두 팀의 실력 합이 최대한 비슷하게 분할
  var s=ps.slice().sort(function(a,b){return lsc(b)-lsc(a);});
  var teams=[],id=0,i;
  for(i=0;i+3<s.length;i+=4){
    var g=s.slice(i,i+4); // 등급 높은 순 4명
    // 3가지 분할 중 두 팀 합 차이가 가장 작은 것
    var opts=[[0,3,1,2],[0,1,2,3],[0,2,1,3]];
    var best=opts[0],bestDiff=Infinity;
    for(var o=0;o<opts.length;o++){
      var c=opts[o];
      var s1=lsc(g[c[0]])+lsc(g[c[1]]);
      var s2=lsc(g[c[2]])+lsc(g[c[3]]);
      var diff=Math.abs(s1-s2);
      if(diff<bestDiff){bestDiff=diff;best=c;}
    }
    teams.push({id:id++,p1:g[best[0]],p2:g[best[1]]});
    teams.push({id:id++,p1:g[best[2]],p2:g[best[3]]});
  }
  // 나머지 인원 (4의 배수가 아닐 때) — 고수+초보 페어
  var left=s.slice(i);
  if(left.length>=2){
    var half=Math.floor(left.length/2);
    var topL=left.slice(0,half),botL=left.slice(half);
    for(var k=0;k<half;k++) teams.push({id:id++,p1:topL[k],p2:botL[k]});
  }
  return{teams:teams,dup:hasDup(teams,h)};
}
// 사제 매치: 고수+초보를 한 팀으로 (배우는 느낌)
// 전체를 실력순 정렬 → 상위 절반(고수) + 하위 절반(초보)으로 가르고
// 고수 1명 + 초보 1명을 한 팀으로 묶음 → 모든 팀이 "고수+초보" 구성
function bMentor(ps,h){
  var teams=[],id=0;
  var s=ps.slice().sort(function(a,b){return lsc(b)-lsc(a);}); // 높은 순
  var n=s.length;
  var half=Math.floor(n/2);
  var tops=s.slice(0,half);            // 고수 그룹 (상위 절반)
  var bots=s.slice(half);              // 초보 그룹 (하위 절반)
  // 매번 다른 고수+초보 조합이 나오도록 초보 그룹을 섞음
  // (고수+초보 원칙은 유지 — 상위그룹 1명 + 하위그룹 1명)
  bots=shuf(bots);
  for(var i=0;i<half;i++){
    teams.push({id:id++,p1:tops[i],p2:bots[i]});
  }
  return{teams:teams,dup:hasDup(teams,h)};
}
// 동급 대결: 급수 순 정렬 → 4명씩 묶어서 그 안에서 랜덤 페어
// → 한 경기의 4명이 최대한 비슷한 수준
function bSameLevel(ps,h){
  var s=ps.slice().sort(function(a,b){return lsc(a)-lsc(b);});
  var teams=[],id=0,i;
  for(i=0;i+3<s.length;i+=4){
    var g=s.slice(i,i+4);
    // 동급 대결은 인접 페어링만 사용 (비슷한 등급끼리 묶기)
    // g[0]·g[1] (낮은 둘) vs g[2]·g[3] (높은 둘)
    teams.push({id:id++,p1:g[0],p2:g[1]});
    teams.push({id:id++,p1:g[2],p2:g[3]});
  }
  // 나머지 인원 처리 (4의 배수가 아닐 때)
  var left=s.slice(i);
  while(left.length>=2) teams.push({id:id++,p1:left.shift(),p2:left.shift()});
  return{teams:teams,dup:hasDup(teams,h)};
}
function buildWithMode(ps,h,mode){
  if(mode==='balanced') return bBal(ps,h);
  if(mode==='mentor') return bMentor(ps,h);
  if(mode==='sameclose'||mode==='samewide') return bSameLevel(ps,h);
  return bRandom(ps,h);
}
function build(ps,h){return buildWithMode(ps,h,S.pairMode);}
// 팀 평균 급수 계산
function teamAvgLv(t){return lsc(t.p1)+lsc(t.p2);}
// 두 팀 간 급수 차이
function teamLvDiff(ta,tb){return Math.abs(teamAvgLv(ta)-teamAvgLv(tb));}
function pickSB(ps,prevSB,rc){
  rc=rc||S.restCount;
  var sorted=ps.slice().sort(function(a,b){return (rc[a.name]||0)-(rc[b.name]||0);});
  var other=sorted.filter(function(p){return!prevSB||p.name!==prevSB.name;});
  return other.length?other[0]:sorted[0];
}
function doTeams(){
  var ps=getSelected(),isOdd=ps.length%2,ac=ps,sb=null;
  if(isOdd){sb=pickSB(ps,S.standby,S.restCount);ac=ps.filter(function(p){return p.name!==sb.name;});}
  S.standby=sb;S.groups={};

  if(S.matchMode==='mixed'){
    var g1=ac.filter(function(p){return (S.playerGroups[p.name]||1)===1;});
    var g2=ac.filter(function(p){return (S.playerGroups[p.name]||1)===2;});
    if(g1.length%2!==0&&g1.length>0){g2.push(g1.pop());}
    if(g2.length%2!==0&&g2.length>0){g1.push(g2.pop());}
    var r1=g1.length>=2?build(g1):{teams:[],dup:false};
    var r2=g2.length>=2?build(g2):{teams:[],dup:false};
    var allTeams=[],id=0;
    for(var i=0;i<r1.teams.length;i++){r1.teams[i].id=id++;allTeams.push(r1.teams[i]);S.groups[r1.teams[i].id]=1;}
    for(var i=0;i<r2.teams.length;i++){r2.teams[i].id=id++;allTeams.push(r2.teams[i]);S.groups[r2.teams[i].id]=2;}
    S.teams=allTeams;S.dup=r1.dup||r2.dup;
  } else {
    var r=build(ac);S.teams=r.teams;S.dup=r.dup;
  }
}

// 로테이션 스케줄 생성 (세트마다 팀 재배정)
function mkRotationSchedule(){
  var lates=getLateArrivals();
  var ps=getSelected(); // 늦참 제외
  var psAll=lates.length>0?ps.concat(lates):ps; // 늦참 합류용
  var tempH=S.history.slice();
  var tempSB=S.standby;
  var tempRC={};for(var k in S.restCount)tempRC[k]=S.restCount[k];
  var allTeams=[],allMatches=[],blockInfo=[];
  var teamId=0,matchId=0;

  // 누적 출전 횟수 & 마지막 출전 세트 & 페어 카운트 & 함께 게임 횟수
  var playCount={};
  var lastPlayedSet={};
  var pairCount={};      // 두 사람이 같은 팀(파트너)이었던 횟수
  var encounterCount={}; // 두 사람이 같은 게임(4명)에 있던 횟수 (상대 포함)
  for(var i=0;i<ps.length;i++){playCount[ps[i].name]=0; lastPlayedSet[ps[i].name]=-1;}
  function pairKey(a,b){return [a,b].sort().join('||');}
  // 4명이 한 게임에 모였을 때 서로 만난 횟수 기록
  function recordEncounter(four){
    for(var x=0;x<four.length;x++)for(var y=x+1;y<four.length;y++){
      var k=pairKey(four[x].name,four[y].name);
      encounterCount[k]=(encounterCount[k]||0)+1;
    }
  }
  // 후보가 이미 뽑힌 그룹과 얼마나 자주 만났는지 합산
  function encScore(cand,group){
    var s=0;
    for(var i=0;i<group.length;i++) s+=(encounterCount[pairKey(cand.name,group[i].name)]||0);
    return s;
  }

  // 4명의 3가지 페어링 중 점수가 가장 낮은 것 (파트너 중복 + 상대 만남 중복)
  function findBestPairing(four){
    if(!four||four.length!==4) return null;
    var options=[
      [[four[0],four[1]],[four[2],four[3]]],
      [[four[0],four[2]],[four[1],four[3]]],
      [[four[0],four[3]],[four[1],four[2]]]
    ];
    var best=null,bestScore=Infinity;
    for(var i=0;i<options.length;i++){
      var o=options[i];
      // 파트너 중복 (같은 팀이었던 횟수) — 같은 편 반복 방지 (가중치 크게)
      var partnerS=(pairCount[pairKey(o[0][0].name,o[0][1].name)]||0)+
                   (pairCount[pairKey(o[1][0].name,o[1][1].name)]||0);
      // 상대 중복 (서로 상대편으로 만난 횟수) — 같은 상대 반복 방지
      var oppS=(encounterCount[pairKey(o[0][0].name,o[1][0].name)]||0)+
               (encounterCount[pairKey(o[0][0].name,o[1][1].name)]||0)+
               (encounterCount[pairKey(o[0][1].name,o[1][0].name)]||0)+
               (encounterCount[pairKey(o[0][1].name,o[1][1].name)]||0);
      // 파트너 중복을 상대 중복보다 더 강하게 피함 (파트너 2배 가중)
      var score=partnerS*2+oppS;
      if(score<bestScore){bestScore=score;best=o;}
    }
    return {pairing:best,score:bestScore};
  }

  // 여러 명을 4명씩 여러 게임으로 나누기 (코트 수 무관, 다양성 최대)
  // greedy: 아직 안 만난 사람끼리 묶어서 각 게임의 만남 중복 최소화
  function splitIntoGames(players, numGames){
    var remaining=players.slice();
    var games=[];
    for(var g=0;g<numGames;g++){
      if(remaining.length<4) break;
      // 첫 사람: 남은 사람 중 임의(앞에서)
      var group=[remaining.shift()];
      // 나머지 3명: 이미 뽑힌 group과 만남 횟수가 가장 적은 사람부터
      while(group.length<4&&remaining.length>0){
        remaining.sort(function(a,b){
          var sa=0,sb=0;
          for(var i=0;i<group.length;i++){
            sa+=(encounterCount[pairKey(a.name,group[i].name)]||0);
            sb+=(encounterCount[pairKey(b.name,group[i].name)]||0);
          }
          if(sa!==sb) return sa-sb;
          // 동점이면 파트너 중복 적은 사람
          var pa=0,pb=0;
          for(var i=0;i<group.length;i++){
            pa+=(pairCount[pairKey(a.name,group[i].name)]||0);
            pb+=(pairCount[pairKey(b.name,group[i].name)]||0);
          }
          if(pa!==pb) return pa-pb;
          return Math.random()-0.5;
        });
        group.push(remaining.shift());
      }
      // 4명 안에서 최적 페어링 (파트너 중복 최소)
      var bp=findBestPairing(group);
      games.push(bp?bp.pairing:[[group[0],group[1]],[group[2],group[3]]]);
    }
    return games;
  }

  // 4명이 서로 만난 총 횟수 (게임 내 다양성)
  function groupEncScore(four){
    var s=0;
    for(var x=0;x<four.length;x++)for(var y=x+1;y<four.length;y++){
      s+=(encounterCount[pairKey(four[x].name,four[y].name)]||0);
    }
    return s;
  }

  // 8명을 2게임(4명+4명)으로 나누는 최적 분할 + 페어링 (완전탐색)
  function splitInto2Games(eight){
    if(!eight||eight.length<8) return null;
    var bestSplit=null,bestScore=Infinity;
    for(var b=1;b<6;b++){
      for(var c=b+1;c<7;c++){
        for(var d=c+1;d<8;d++){
          var g1=[eight[0],eight[b],eight[c],eight[d]];
          var g2=[];
          for(var i=0;i<8;i++){
            if(i!==0&&i!==b&&i!==c&&i!==d) g2.push(eight[i]);
          }
          var p1=findBestPairing(g1);
          var p2=findBestPairing(g2);
          if(!p1||!p2) continue;
          var encS=groupEncScore(g1)+groupEncScore(g2);
          var s=(p1.score+p2.score)+encS*4;
          if(s<bestScore){bestScore=s;bestSplit={g1:p1.pairing,g2:p2.pairing};}
        }
      }
    }
    return bestSplit;
  }

  // [구버전 호환] 4명 페어링 최적화
  function optimizePairing(team1,team2){
    if(!team1||!team2) return null;
    var p=[team1.p1,team1.p2,team2.p1,team2.p2];
    var res=findBestPairing(p);
    if(!res) return null;
    return [
      {p1:res.pairing[0][0],p2:res.pairing[0][1]},
      {p1:res.pairing[1][0],p2:res.pairing[1][1]}
    ];
  }

  // 동급 대결 모드용: 비슷한 등급 4명 뽑기
  function pickSameLevelGroup(pool,n){
    if(pool.length<=n) return pool.slice();
    var withCount=pool.map(function(p){return {p:p,c:playCount[p.name]||0};});
    withCount.sort(function(a,b){return a.c-b.c;});
    var minC=withCount[0].c;
    var candidates=withCount.filter(function(x){return x.c<=minC+1;}).map(function(x){return x.p;});
    if(candidates.length<n){
      candidates=withCount.slice(0,Math.max(n,Math.min(n*2,withCount.length))).map(function(x){return x.p;});
    }
    candidates.sort(function(a,b){return lsc(a)-lsc(b);});
    // 등급 차이가 최소인 연속 n명 윈도우 선택
    var bestStart=0,bestRange=Infinity;
    for(var i=0;i+n<=candidates.length;i++){
      var r=lsc(candidates[i+n-1])-lsc(candidates[i]);
      if(r<bestRange){bestRange=r;bestStart=i;}
    }
    return candidates.slice(bestStart,bestStart+n);
  }

  // 수준별(넓게): 출전 공평성 우선 확보 후, 그 안에서 인접 등급끼리 묶기
  function pickWideLevelGroup(pool,n,curSet){
    if(pool.length<=n) return pool.slice();
    // 출전 공평성을 지킨 후보를 약간 넓게 확보 (n+2명)
    var poolSize=Math.min(pool.length,n+2);
    var cand=pickFewestPlayers(pool,poolSize,curSet);
    // 등급순 정렬 후 인접 n명 (등급 비슷하되 매번 약간 다른 멤버)
    cand.sort(function(a,b){return lsc(a)-lsc(b);});
    var maxStart=cand.length-n;
    var startIdx=maxStart>0?Math.floor(Math.random()*(maxStart+1)):0;
    return cand.slice(startIdx,startIdx+n);
  }

  // 우선순위: 출전 횟수 → 3판이상 쉰사람 강제(상한) → 다양성 → 오래 쉰 사람 → 랜덤
  // 다양성 최우선, 단 아무도 3판 넘게 쉬지 않도록 상한 적용
  function pickFewestPlayers(pool,n,curSet){
    var picked=[];
    var remaining=pool.slice();
    while(picked.length<n&&remaining.length>0){
      remaining.sort(function(a,b){
        var ca=playCount[a.name]||0, cb=playCount[b.name]||0;
        // 1순위: 출전 횟수 (공평성)
        if(ca!==cb) return ca-cb;
        // 2순위: 3판 이상 쉰 사람 강제 투입 (텀 절대 상한)
        var la=lastPlayedSet[a.name];if(la===undefined||la===null)la=-1;
        var lb=lastPlayedSet[b.name];if(lb===undefined||lb===null)lb=-1;
        var gapA=(curSet||0)-1-la, gapB=(curSet||0)-1-lb;
        var hardA=gapA>=3?0:1, hardB=gapB>=3?0:1;
        if(hardA!==hardB) return hardA-hardB;
        // 3순위: 다양성 (안 만난 사람 우선) — 상대 만남 + 파트너 중복 합산
        if(picked.length>0){
          var sa=0,sb=0;
          for(var pi=0;pi<picked.length;pi++){
            // 상대로 만난 횟수(encounter) + 같은 편이었던 횟수(pair)*2 를 합산
            sa+=(encounterCount[pairKey(a.name,picked[pi].name)]||0)
               +(pairCount[pairKey(a.name,picked[pi].name)]||0)*2;
            sb+=(encounterCount[pairKey(b.name,picked[pi].name)]||0)
               +(pairCount[pairKey(b.name,picked[pi].name)]||0)*2;
          }
          if(sa!==sb) return sa-sb;
        }
        // 4순위: 오래 쉰 사람 (텀 방지)
        if(la!==lb) return la-lb;
        return Math.random()-0.5;
      });
      picked.push(remaining.shift());
    }
    return picked;
  }

  // 코트별 선수 분류 (numCourts개 코트)
  var nc=Math.max(1,S.numCourts||1);
  var courtPlayers={};
  var hasMultiCourt=false;
  for(var ci=1;ci<=nc;ci++){
    courtPlayers[ci]=ps.filter(function(p){return (S.playerGroups[p.name]||1)===ci;});
  }
  var courtsWithPlayers=0;
  for(var ci=1;ci<=nc;ci++) if(courtPlayers[ci].length>=4) courtsWithPlayers++;
  hasMultiCourt=courtsWithPlayers>=2;
  var g1ps=courtPlayers[1]||[];
  var g2ps=courtPlayers[2]||[];
  var hasGroups=false; // 코트 분리 제거 — 항상 전체 골고루

  // 게임 수 = 세트 수 (직접 사용)
  var numRot=S.numGames>0?S.numGames:4;

  for(var b=0;b<numRot;b++){
    var blockMode=S.pairMode==='cycle'?getCycleMode(b):S.pairMode;
    var blockLabel=S.pairMode==='cycle'?getCycleLabel(b):'';

    if(hasGroups){
      // ── 멀티코트 모드: 각 코트 안에서 공평하게 4명 선택 → 팀 구성 ──
      var dup=false;
      for(var ci=1;ci<=nc;ci++){
        var cps=courtPlayers[ci]||[];
        if(cps.length<4) continue;
        // 선수 선택: 모드별로 다르게
        var playing;
        if(blockMode==='sameclose'){
          playing=pickSameLevelGroup(cps,4);
        } else if(blockMode==='samewide'){
          playing=pickWideLevelGroup(cps,4,b);
        } else {
          playing=pickFewestPlayers(cps,4,b);
        }
        var rc=buildWithMode(playing,tempH,blockMode);
        var bt=rc.teams.slice(0,2);
        // 랜덤/순환 모드면 페어링 최적화 (균형/동급은 의도 보존)
        if(bt.length===2&&blockMode==='random'){
          var opt=optimizePairing(bt[0],bt[1]);
          if(opt){bt[0].p1=opt[0].p1;bt[0].p2=opt[0].p2;bt[1].p1=opt[1].p1;bt[1].p2=opt[1].p2;}
        }
        dup=dup||rc.dup;
        for(var i=0;i<bt.length;i++){
          var kk=pk(bt[i].p1,bt[i].p2);
          if(tempH.indexOf(kk)===-1) tempH.push(kk);
          bt[i].id=teamId++;bt[i].blockNum=b+1;bt[i].grp=ci;
          allTeams.push(bt[i]);
          // 출전 횟수 + 마지막 출전 세트 + 페어 카운트 업데이트
          playCount[bt[i].p1.name]=(playCount[bt[i].p1.name]||0)+1;
          playCount[bt[i].p2.name]=(playCount[bt[i].p2.name]||0)+1;
          lastPlayedSet[bt[i].p1.name]=b;
          lastPlayedSet[bt[i].p2.name]=b;
          var pk2=pairKey(bt[i].p1.name,bt[i].p2.name);
          pairCount[pk2]=(pairCount[pk2]||0)+1;
        }
        if(bt.length>=2){
          allMatches.push({id:matchId++,t1:bt[0].id,t2:bt[1].id,blockNum:b+1,court:ci});
          recordEncounter([bt[0].p1,bt[0].p2,bt[1].p1,bt[1].p2]);
        }
      }
      blockInfo.push({blockNum:b+1,standby:null,dup:dup,skip:false,modeLabel:blockLabel});
    } else {
      // ── 일반 모드: 전체 선수 중 공평하게 (nc*4)명 선택 → 팀 구성 ──
      var needed=nc*4;
      var available=ps;
      if(available.length<4){blockInfo.push({blockNum:b+1,standby:null,dup:false,skip:true,modeLabel:''});continue;}
      // 출전 횟수 적은 순으로 needed명 선택 (인원이 부족하면 가능한 만큼)
      var actualNeeded=Math.min(needed,Math.floor(available.length/4)*4);
      if(actualNeeded<4) actualNeeded=4;
      // 모드별 선수 선택
      var playing;
      if(blockMode==='sameclose'){
        // 출전 공평성 지킨 actualNeeded명 → 등급순 정렬 (비슷한 수준끼리)
        var pool=pickFewestPlayers(available,actualNeeded,b);
        pool.sort(function(a,b){return lsc(a)-lsc(b);});
        playing=pool;
      } else if(blockMode==='samewide'){
        // 넓게: 공평성 지킨 actualNeeded명 확보 → 등급순 정렬 후 인접하게 살짝 섞기
        var pool=pickFewestPlayers(available,actualNeeded,b);
        pool.sort(function(a,b){return lsc(a)-lsc(b);});
        // 인접한 사람끼리만 가볍게 셔플 (등급 인접 섞임, 공평성은 유지)
        for(var sw=0;sw<pool.length-1;sw+=2){
          if(Math.random()<0.5){var tmp=pool[sw];pool[sw]=pool[sw+1];pool[sw+1]=tmp;}
        }
        playing=pool;
      } else {
        playing=pickFewestPlayers(available,actualNeeded,b);
      }
      var r=buildWithMode(playing,tempH,blockMode);
      var blockTeams=r.teams.slice(0,nc*2);
      // 랜덤/순환 모드: 다양성 최대화 분할
      if(blockMode==='random'&&nc===2&&blockTeams.length===4){
        // 2코트(8명): 완전탐색으로 최적 분할
        var eight=[];
        for(var pi=0;pi<blockTeams.length;pi++){
          eight.push(blockTeams[pi].p1);
          eight.push(blockTeams[pi].p2);
        }
        var split=splitInto2Games(eight);
        if(split){
          blockTeams[0].p1=split.g1[0][0]; blockTeams[0].p2=split.g1[0][1];
          blockTeams[1].p1=split.g1[1][0]; blockTeams[1].p2=split.g1[1][1];
          blockTeams[2].p1=split.g2[0][0]; blockTeams[2].p2=split.g2[0][1];
          blockTeams[3].p1=split.g2[1][0]; blockTeams[3].p2=split.g2[1][1];
        }
      } else if(blockMode==='random'&&nc>=3&&blockTeams.length>=6){
        // 3코트 이상: 모든 출전자를 다양성 기준으로 게임별 재분할
        var allP=[];
        for(var pi=0;pi<blockTeams.length;pi++){allP.push(blockTeams[pi].p1);allP.push(blockTeams[pi].p2);}
        var games=splitIntoGames(allP,nc);
        var ti=0;
        for(var gi=0;gi<games.length;gi++){
          blockTeams[ti].p1=games[gi][0][0]; blockTeams[ti].p2=games[gi][0][1]; ti++;
          blockTeams[ti].p1=games[gi][1][0]; blockTeams[ti].p2=games[gi][1][1]; ti++;
        }
      } else if(blockMode==='random') {
        // 1코트: 4명 페어링만 최적화
        for(var pi=0;pi<blockTeams.length-1;pi+=2){
          var opt=optimizePairing(blockTeams[pi],blockTeams[pi+1]);
          if(opt){
            blockTeams[pi].p1=opt[0].p1;blockTeams[pi].p2=opt[0].p2;
            blockTeams[pi+1].p1=opt[1].p1;blockTeams[pi+1].p2=opt[1].p2;
          }
        }
      }
      for(var i=0;i<blockTeams.length;i++){
        var kk=pk(blockTeams[i].p1,blockTeams[i].p2);
        if(tempH.indexOf(kk)===-1) tempH.push(kk);
        blockTeams[i].id=teamId++;blockTeams[i].blockNum=b+1;
        allTeams.push(blockTeams[i]);
        // 출전 횟수 + 마지막 출전 세트 + 페어 카운트 업데이트
        playCount[blockTeams[i].p1.name]=(playCount[blockTeams[i].p1.name]||0)+1;
        playCount[blockTeams[i].p2.name]=(playCount[blockTeams[i].p2.name]||0)+1;
        lastPlayedSet[blockTeams[i].p1.name]=b;
        lastPlayedSet[blockTeams[i].p2.name]=b;
        var pk2=pairKey(blockTeams[i].p1.name,blockTeams[i].p2.name);
        pairCount[pk2]=(pairCount[pk2]||0)+1;
      }
      for(var i=0;i<blockTeams.length-1;i+=2){
        allMatches.push({id:matchId++,t1:blockTeams[i].id,t2:blockTeams[i+1].id,blockNum:b+1,court:(i/2)+1});
        recordEncounter([blockTeams[i].p1,blockTeams[i].p2,blockTeams[i+1].p1,blockTeams[i+1].p2]);
      }
      // 쉬는 사람 (대기자) 계산 - 1명 차이 날 때만 standby 표시 (코트 수 부족시엔 표시 안 함)
      var resting=available.filter(function(p){
        for(var i=0;i<playing.length;i++) if(playing[i].name===p.name) return false;
        return true;
      });
      // standby는 인원이 안 맞아 어쩔 수 없이 1명만 빠질 때만 (5명, 9명 같은 경우)
      var standbyOne=(resting.length===1&&available.length<nc*4+2)?resting[0]:null;
      blockInfo.push({blockNum:b+1,standby:standbyOne,dup:r.dup,skip:false,modeLabel:blockLabel,resting:resting});
    }
  }
  // 늦참자 합류 세트 추가 (늦참 전원 포함)
  if(lates.length>0){
    var psWithLate=psAll; // 전체 (기존+늦참)
    var hasGroupsL=false;
    var g1L=psWithLate.filter(function(p){return (S.playerGroups[p.name]||1)===1;});
    var g2L=psWithLate.filter(function(p){return (S.playerGroups[p.name]||1)===2;});
    if(S.groupMode!=='any'&&g1L.length>=2&&g2L.length>=2) hasGroupsL=true;
    var lateBlockMode=S.pairMode==='cycle'?getCycleMode(numRot):S.pairMode;
    var lateLabel='';

    if(hasGroupsL){
      var rl1=buildWithMode(g1L,tempH,lateBlockMode);
      var rl2=buildWithMode(g2L,tempH,lateBlockMode);
      var bt1L=rl1.teams.slice(0,2),bt2L=rl2.teams.slice(0,2);
      for(var i=0;i<bt1L.length;i++){bt1L[i].id=teamId++;bt1L[i].blockNum=numRot+1;bt1L[i].grp=1;allTeams.push(bt1L[i]);}
      for(var i=0;i<bt2L.length;i++){bt2L[i].id=teamId++;bt2L[i].blockNum=numRot+1;bt2L[i].grp=2;allTeams.push(bt2L[i]);}
      if(bt1L.length>=2) allMatches.push({id:matchId++,t1:bt1L[0].id,t2:bt1L[1].id,blockNum:numRot+1,court:1});
      if(bt2L.length>=2) allMatches.push({id:matchId++,t1:bt2L[0].id,t2:bt2L[1].id,blockNum:numRot+1,court:2});
      blockInfo.push({blockNum:numRot+1,standby:null,dup:rl1.dup||rl2.dup,skip:false,modeLabel:lateLabel});
    } else {
      if(psWithLate.length>=4){
        var rl=buildWithMode(psWithLate,tempH,lateBlockMode);
        for(var i=0;i<rl.teams.length;i++){rl.teams[i].id=teamId++;rl.teams[i].blockNum=numRot+1;allTeams.push(rl.teams[i]);}
        for(var i=0;i<rl.teams.length-1;i+=2) allMatches.push({id:matchId++,t1:rl.teams[i].id,t2:rl.teams[i+1].id,blockNum:numRot+1});
        blockInfo.push({blockNum:numRot+1,standby:null,dup:rl.dup,skip:false,modeLabel:lateLabel});
      }
    }
  }

  return{teams:allTeams,matches:allMatches,blockInfo:blockInfo};
}

function mkMatches(ts){
  var all=[],id=0,i,j;
  // 팀 ID → 팀 객체 빠른 조회
  var tmap={};for(i=0;i<ts.length;i++) tmap[ts[i].id]=ts[i];

  for(i=0;i<ts.length;i++)
    for(j=i+1;j<ts.length;j++)
      all.push({id:id++,t1:ts[i].id,t2:ts[j].id,blockNum:0});

  // 혼합 모드: 그룹 간 매치 먼저
  if(S.matchMode==='mixed'){
    all.sort(function(a,b){
      var aMix=(S.groups[a.t1]!==S.groups[a.t2])?1:0;
      var bMix=(S.groups[b.t1]!==S.groups[b.t2])?1:0;
      return bMix-aMix;
    });
  }
  // 게임 수 제한 (모두 랜덤 추출)
  if(S.numGames>0&&S.numGames<all.length){
    if(S.matchMode!=='mixed') all=shuf(all);
    all=all.slice(0,S.numGames);
  }
  for(var k=0;k<all.length;k++) all[k].id=k;
  return all;
}
function copyResults(){
  var ms=S.matches,ts=S.teams;
  var lines=['⚡🏸 피카츄의 배드민턴매치 (라운드 '+S.round+')','──────────────'];
  var curBlock=-1;
  for(var i=0;i<ms.length;i++){
    var m=ms[i],t1=null,t2=null;
    for(var j=0;j<ts.length;j++){if(ts[j].id===m.t1)t1=ts[j];if(ts[j].id===m.t2)t2=ts[j];}
    if(S.matchMode==='rotation'&&m.blockNum!==curBlock){curBlock=m.blockNum;lines.push('[ 게임 '+curBlock+' ]');}
    // 점수가 있으면 결과까지 함께 (승리 팀에 ✅)
    var w=matchWinner(m);
    var l1=t1.p1.name+' & '+t1.p2.name, l2=t2.p1.name+' & '+t2.p2.name;
    if(w){
      lines.push((i+1)+'게임  '+(w==='a'?'✅ ':'')+l1+'  '+m.s1+' : '+m.s2+'  '+(w==='b'?'✅ ':'')+l2);
    } else {
      lines.push((i+1)+'게임  '+l1+'  vs  '+l2);
    }
  }
  if(S.standby)lines.push('──────────────\n⏳ 대기: '+S.standby.name);
  else lines.push('──────────────');

  // 전적 (점수가 입력된 경기가 있을 때만)
  var recs=calcRecords();
  if(recs.length>0){
    lines.push('','🏆 전적 (승-패 · 승률)');
    for(var ri=0;ri<recs.length;ri++){
      var r=recs[ri],medal=ri===0?'🥇':ri===1?'🥈':ri===2?'🥉':(ri+1)+'.';
      var st=r.streak>=2?' 🔥'+r.streak+'연승':'';
      lines.push(medal+' '+r.name+'  '+r.w+'-'+r.l+' · '+r.rate+'%'+st);
    }
    lines.push('──────────────');
  }

  var text=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('📋 복사됐어요! 카톡에 붙여넣기 하세요');}).catch(function(){fbCopy(text);});}else{fbCopy(text);}
}
function fbCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('📋 복사됐어요!');}catch(e){toast('직접 선택해서 복사해 주세요');}document.body.removeChild(ta);}

    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){toast('🔗 링크 복사됐어요! 카톡에 붙여넣기 하세요');}).catch(function(){fbCopyUrl(url);});
    } else { fbCopyUrl(url); }
  }
}
function fbCopyUrl(url){var ta=document.createElement('textarea');ta.value=url;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('🔗 링크 복사됐어요!');}catch(e){toast('주소창 URL을 직접 복사해 주세요');}document.body.removeChild(ta);}

// ── 대진표 이미지 생성 ──────────────────────────────────────────────
function generateResultImage(){
  var ms=S.matches,ts=S.teams;
  var COURT_COLS=['#1565c0','#c2185b','#2e7d32','#ef6c00','#6a1b9a','#00838f'];
  var KO='"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
  var GREEN='#1f8a4c',INK='#16241c';

  // 게임별로 묶기 — 게임 안에서는 코트 번호 순
  var games={},order=[],courtSet={},players={};
  for(var i=0;i<ms.length;i++){
    var m=ms[i],t1=null,t2=null;
    for(var j=0;j<ts.length;j++){if(ts[j].id===m.t1)t1=ts[j];if(ts[j].id===m.t2)t2=ts[j];}
    if(!t1||!t2) continue;
    if(t1.grp&&t2.grp&&t1.grp!==t2.grp) continue;
    var cid=(t1.grp)||m.court||1;
    var bn=m.blockNum||0;
    if(!games[bn]){games[bn]=[];order.push(bn);}
    games[bn].push({cid:cid,t1:t1,t2:t2});
    courtSet[cid]=true;
    [t1.p1,t1.p2,t2.p1,t2.p2].forEach(function(p){players[p.name]=true;});
  }
  order.sort(function(a,b){return a-b;});
  for(var oi=0;oi<order.length;oi++) games[order[oi]].sort(function(a,b){return a.cid-b.cid;});
  var nCourts=Object.keys(courtSet).length;
  var multi=nCourts>1;

  // 크기 — 폰에서 봐도 글씨가 읽히도록 720 폭에 2배로 그린다
  var W=720,SC=2,padX=16,gap=10,headerH=100,footH=36,cardHead=32,lineH=38;
  var canvas=document.createElement('canvas');
  var ctx=canvas.getContext('2d');

  // 이름 글씨 크기는 이미지 전체에서 하나로 — 가장 긴 팀 이름이 칸에 들어가는 크기 (16 → 최소 13px)
  // 2개씩 놓아서 13px로도 안 들어가면 한 줄에 게임 1개로 넓힌다
  var chipW=multi?48:0,longest=0;
  for(var oi=0;oi<order.length;oi++){
    var gl=games[order[oi]];
    for(var li=0;li<gl.length;li++){
      [gl[li].t1,gl[li].t2].forEach(function(t){
        ctx.font='800 16px '+KO;
        longest=Math.max(longest,ctx.measureText(t.p1.name+'·'+t.p2.name).width);
      });
    }
  }
  function nameRoom(cw){return (cw-20-chipW)/2-16;}
  var cols=2,cardW=(W-padX*2-gap)/2;
  if(longest*13/16>nameRoom(cardW)){cols=1;cardW=W-padX*2;}
  var nameFs=Math.max(13,Math.min(16,Math.floor(16*nameRoom(cardW)/Math.max(longest,1)*2)/2));

  var rows=[],y=headerH;
  for(var gi=0;gi<order.length;gi+=cols){
    var h=0;
    for(var k=gi;k<gi+cols&&k<order.length;k++) h=Math.max(h,cardHead+games[order[k]].length*lineH);
    rows.push({y:y,h:h});
    y+=h+gap;
  }
  var H=y-gap+footH;

  canvas.width=W*SC;canvas.height=H*SC;
  ctx.scale(SC,SC);
  ctx.textBaseline='middle';

  // 배경 + 머리
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=GREEN;ctx.fillRect(0,0,W,5);
  ctx.textAlign='center';
  ctx.fillStyle=GREEN;ctx.font='800 28px '+KO;
  ctx.fillText('🏸 피카츄의 배드민턴매치',W/2,40);
  var now=new Date();
  ctx.fillStyle='#5b6b61';ctx.font='600 15px '+KO;
  ctx.fillText((now.getMonth()+1)+'월 '+now.getDate()+'일 · '+Object.keys(players).length+'명 · '
    +nCourts+'코트 · '+order.length+'게임',W/2,72);

  // 게임 카드 — 가로 2개씩 (이름이 길면 1개씩)
  for(var gi=0;gi<order.length;gi++){
    var row=rows[Math.floor(gi/cols)];
    var x=padX+(gi%cols)*(cardW+gap),cy=row.y,ch=cardHead+games[order[gi]].length*lineH;
    // 테두리 + 초록 머리
    ctx.save();
    roundRect(ctx,x,cy,cardW,ch,12);ctx.clip();
    ctx.fillStyle='#ffffff';ctx.fillRect(x,cy,cardW,ch);
    ctx.fillStyle=GREEN;ctx.fillRect(x,cy,cardW,cardHead);
    ctx.restore();
    ctx.strokeStyle='#dfe6e1';ctx.lineWidth=1;
    roundRect(ctx,x+.5,cy+.5,cardW-1,ch-1,12);ctx.stroke();
    ctx.textAlign='left';ctx.fillStyle='#ffffff';ctx.font='800 16px '+KO;
    ctx.fillText('게임 '+order[gi],x+12,cy+cardHead/2+1);

    var gms=games[order[gi]];
    for(var li=0;li<gms.length;li++){
      var g=gms[li],ly=cy+cardHead+li*lineH,mid=ly+lineH/2;
      if(li>0){ctx.fillStyle='#eef2ef';ctx.fillRect(x+1,ly,cardW-2,1);}
      var left=x+10;
      // 코트가 여러 개일 때만 코트 딱지
      if(multi){
        var cc=COURT_COLS[(g.cid-1)%COURT_COLS.length];
        ctx.font='800 11px '+KO;
        var cl=g.cid+'코트',cw=ctx.measureText(cl).width+12;
        ctx.fillStyle=cc;roundRect(ctx,left,mid-10,cw,20,6);ctx.fill();
        ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.fillText(cl,left+cw/2,mid+1);
        left+=cw+8;
      }
      var right=x+cardW-10,vsX=(left+right)/2,nameMaxW=(right-left)/2-16;
      var a=g.t1.p1.name+'·'+g.t1.p2.name,b=g.t2.p1.name+'·'+g.t2.p2.name;
      ctx.fillStyle=INK;ctx.font='800 '+nameFs+'px '+KO;
      // 마지막 안전장치: 그래도 넘치면 칸 폭 안으로 눌러 넣어 vs와 겹치지 않게
      ctx.textAlign='left';ctx.fillText(a,left,mid+1,nameMaxW);
      ctx.textAlign='right';ctx.fillText(b,right,mid+1,nameMaxW);
      ctx.textAlign='center';ctx.fillStyle='#8a978f';ctx.font='800 11px '+KO;ctx.fillText('vs',vsX,mid+1);
    }
  }

  // 발치
  ctx.textAlign='center';ctx.fillStyle='rgba(22,36,28,0.35)';
  ctx.font='12px '+KO;ctx.fillText('피카츄의 배드민턴매치',W/2,H-16);

  canvas.toBlob(function(blob){
    // 폰·태블릿 감지 (최신 아이패드는 Macintosh로 잡히므로 터치 여부도 확인)
    var ua=navigator.userAgent;
    var isIOS=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
    var isAndroid=/Android/.test(ua);
    var isMobile=isIOS||isAndroid||('ontouchstart' in window&&navigator.maxTouchPoints>0&&window.innerWidth<1100);
    if(isMobile){
      // 폰·태블릿: 공유 시트로 바로 저장 (갤럭시·아이폰 모두 "이미지 저장" 선택 가능)
      var file=new File([blob],'배드민턴대진표.png',{type:'image/png'});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'배드민턴 대진표'})
          .then(function(){ toast('✅ 저장 완료!'); })
          .catch(function(e){
            // 사용자가 취소한 게 아니면 오버레이로 대체
            if(e&&e.name!=='AbortError') showImageOverlay(blob);
          });
      } else {
        // 공유 미지원 기기: 이미지 띄워 꾹 눌러 저장
        showImageOverlay(blob);
      }
    } else {
      // 컴퓨터: 바로 다운로드
      dlBlob(blob);
    }
  },'image/png');
}

// 둥근 사각형 헬퍼
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
// 폰·태블릿: 대진표 이미지를 화면에 띄워 꾹 눌러 저장하게 함

        +'<button id="img-ov-close" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer">✕ 닫기</button>'
      +'</div>'
      +'<div style="background:rgba(200,241,53,.18);border:1px solid rgba(200,241,53,.4);color:#eaffb0;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;text-align:center;line-height:1.6;width:100%">'
        +'👇 아래 대진표 이미지를 <b>길게 꾹 누른 뒤</b><br>"이미지 저장" 또는 "사진에 추가"를 눌러주세요'
      +'</div>'
      +'<img src="'+url+'" alt="대진표" style="width:100%;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.4);display:block" />'
      +'<div style="color:rgba(255,255,255,.5);font-size:11px;text-align:center;padding-bottom:20px">저장이 끝나면 닫기를 눌러주세요</div>'
    +'</div>';
  document.body.appendChild(ov);
  document.getElementById('img-ov-close').onclick=function(){
    ov.parentNode.removeChild(ov);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  };
  toast('👇 이미지를 꾹 눌러 저장하세요');
}

function dlBlob(blob){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.download='배드민턴대진표.png';
  a.href=url;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  toast('📸 이미지 저장됐어요!');
}

    var liColor=isCur?'var(--white)':'var(--muted)',nameColor=isCur?l.color:'var(--white)';
    var liItems='';for(var j=0;j<info.details.length;j++)liItems+='<li class="grade-li" style="color:'+liColor+'">'+info.details[j]+'</li>';
    out+='<div class="grade-card" style="background:'+cardBg+';border:1px solid '+cardBd+'">'
      +'<div class="grade-card-header"><span class="grade-key" style="color:'+l.color+';background:'+l.color+'28">'+l.key+'</span>'
      +'<span class="grade-short" style="color:'+nameColor+'">'+info.short+'</span></div>'
      +'<div class="grade-desc">'+info.desc+'</div><ul class="grade-ul">'+liItems+'</ul></div>';
  }
  return out+'</div>';
}

  var q=(S.attendSearch||'').trim().toLowerCase();

  // 코트 요약 제거됨 (모든 참석자 전체 혼합)

      +'<input id="asrch" class="inp" placeholder="🔍 이름 검색..." value="'+(S.attendSearch||'')+'" autocomplete="off" autocorrect="off" style="padding-right:36px">'
      +(q?'<button data-a="srchclr" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:transparent;font-size:16px;color:var(--muted);padding:0">×</button>':'')

      +'<div style="display:flex;gap:6px">'
        +(q?'<button class="select-all-btn" data-a="selfiltered">검색결과 전체선택</button>':'')

        +'<b style="color:var(--white)">4.</b> ▶ 진행 중 → ✓ 완료 순서로 클릭<br>'

    out+='<div style="text-align:center;padding:24px;color:var(--muted);font-size:14px">\''+q+'\' 검색 결과가 없어요</div>';

          +'<div class="attend-name">'

          +'</div>'
        +'</div>'
        +lateBtn
        +'</div>';
    }
  }
  out+='</div>'; // attend-list-body

  // 요약 + 늦참 반영 버튼
  if(selCount>=3){
    var msg='✅ '+earlyCount+'명 선착'+(lateCount?' + 🕐 '+lateCount+'명 늦참':'');
    out+='<div style="padding:10px 13px;border-radius:10px;margin-top:10px;font-size:13px;background:rgba(100,180,100,.08);border:1px solid rgba(100,180,100,.25);color:var(--lime)">'+msg+'</div>';
  }

  // 늦참 반영 버튼 (대진표가 있고 늦참자가 있을 때)

// 탭 2: 매치 — Step 2 팀 구성

// 탭 2: 매치 — Step 2 대진표 (팀구성방식 포함)
// ══════════════════════════════════════════════════════════════════
// 3게임 연속 출전/휴식인 사람 계산
// hot[게임번호][이름]=true — 3게임 이상 연속 출전한 구간에 속한 게임 (대진표 이름 빨간색)
function calcStreaks(){
  var result={playing:[],resting:[],hot:{}};
  if(!S.matches||S.matches.length===0) return result;
  // 참석자 전체 (선택된 사람)
  var attendees=[];
  for(var k in S.selected){ if(S.selected[k]) attendees.push(k); }
  if(attendees.length===0) return result;
  // 게임(블록) 번호 목록 (실제 경기가 있는 것만, 정렬)
  var tmap={};
  for(var i=0;i<S.teams.length;i++) tmap[S.teams[i].id]=S.teams[i];
  var blockSet={};
  for(var i=0;i<S.matches.length;i++) blockSet[S.matches[i].blockNum]=true;
  var blocks=Object.keys(blockSet).map(Number).sort(function(a,b){return a-b;});
  if(blocks.length<3) return result; // 3게임 미만이면 연속 3 불가
  // 각 게임별 출전자 집합
  var playedIn={}; // playedIn[block] = {이름:true}
  for(var bi=0;bi<blocks.length;bi++){
    var bn=blocks[bi]; playedIn[bn]={};
    for(var mi=0;mi<S.matches.length;mi++){
      if(S.matches[mi].blockNum!==bn) continue;
      var t1=tmap[S.matches[mi].t1], t2=tmap[S.matches[mi].t2];
      [t1,t2].forEach(function(t){ if(t){ playedIn[bn][t.p1.name]=true; playedIn[bn][t.p2.name]=true; } });
    }
  }
  // 각 사람별로 연속 출전/휴식 최대 길이 계산
  for(var ai=0;ai<attendees.length;ai++){
    var name=attendees[ai];
    var maxPlay=0, maxRest=0, curPlay=0, curRest=0, runs=[];
    for(var bi=0;bi<blocks.length;bi++){
      var inGame=!!playedIn[blocks[bi]][name];
      if(inGame){ curPlay++; curRest=0; if(curPlay>maxPlay)maxPlay=curPlay; if(curPlay>=3) runs.push(bi); }
      else { curRest++; curPlay=0; if(curRest>maxRest)maxRest=curRest; }
    }
    // 한 번도 안 쉬는 사람은 "연속 출전"이 아니라 전 경기 출전이라 조정할 여지가 없음
    if(maxPlay>=3&&maxRest>0){
      result.playing.push(name);
      // 3번째 이상인 게임과 그 앞 두 게임 = 연속 구간 전체
      for(var ri=0;ri<runs.length;ri++){
        for(var bk=runs[ri]-2;bk<=runs[ri];bk++){
          var hb=blocks[bk]; if(!result.hot[hb]) result.hot[hb]={};
          result.hot[hb][name]=true;
        }
      }
    }
    if(maxRest>=3) result.resting.push(name);
  }
  return result;
}

// 경기 결과 · 전적
// ══════════════════════════════════════════════════════════════════
function teamById(id){for(var i=0;i<S.teams.length;i++)if(S.teams[i].id===id)return S.teams[i];return null;}

// 점수로 승자 판정 — 'a'=왼쪽 팀, 'b'=오른쪽 팀, null=아직 미정
function matchWinner(m){
  var a=parseInt(m.s1,10), b=parseInt(m.s2,10);
  if(isNaN(a)||isNaN(b)||a===b) return null;
  return a>b?'a':'b';
}

// 점수가 입력된 경기 수
function scoredCount(){
  var n=0;
  for(var i=0;i<S.matches.length;i++) if(matchWinner(S.matches[i])) n++;
  return n;
}

// 오늘 전적 — 점수가 입력된 경기만 집계
function calcRecords(){
  var map={},order=[];
  function ent(n){
    if(!map[n]){map[n]={name:n,w:0,l:0,g:0,pf:0,pa:0,seq:[]};order.push(n);}
    return map[n];
  }
  // 경기 순서대로 (게임 번호 → 매치 id)
  var ms=S.matches.slice().sort(function(a,b){
    return (a.blockNum||0)-(b.blockNum||0)||a.id-b.id;
  });
  for(var i=0;i<ms.length;i++){
    var m=ms[i],win=matchWinner(m);
    if(!win) continue;
    var t1=teamById(m.t1),t2=teamById(m.t2);
    if(!t1||!t2) continue;
    var a=parseInt(m.s1,10),b=parseInt(m.s2,10);
    var sides=[{t:t1,pf:a,pa:b,won:win==='a'},{t:t2,pf:b,pa:a,won:win==='b'}];
    for(var si=0;si<sides.length;si++){
      var sd=sides[si],ps=[sd.t.p1,sd.t.p2];
      for(var pi=0;pi<ps.length;pi++){
        var e=ent(ps[pi].name);
        e.g++; e.pf+=sd.pf; e.pa+=sd.pa;
        if(sd.won){e.w++;e.seq.push(1);} else {e.l++;e.seq.push(0);}
      }
    }
  }
  var rows=[];
  for(var oi=0;oi<order.length;oi++){
    var e=map[order[oi]];
    e.rate=e.g?Math.round(e.w/e.g*100):0;
    e.diff=e.pf-e.pa;
    // 현재 연승(+) / 연패(−)
    var cur=0,curWin=false;
    for(var k=e.seq.length-1;k>=0;k--){
      if(k===e.seq.length-1){curWin=e.seq[k]===1;cur=1;}
      else if((e.seq[k]===1)===curWin) cur++;
      else break;
    }
    e.streak=e.seq.length?(curWin?cur:-cur):0;
    // 최다 연승
    var best=0,run=0;
    for(var k2=0;k2<e.seq.length;k2++){
      if(e.seq[k2]===1){run++;if(run>best)best=run;} else run=0;
    }
    e.bestW=best;
    rows.push(e);
  }
  rows.sort(function(a,b){
    return b.w-a.w||b.rate-a.rate||b.diff-a.diff||a.name.localeCompare(b.name,'ko');
  });
  return rows;
}

// 누적 전적 — Firebase 'stats' 에 쌓인 값을 표 형태로
function careerRows(){
  var rows=[];
  for(var n in S.career){
    var c=S.career[n];
    if(!c) continue;
    var g=c.g||0;
    rows.push({name:n,w:c.w||0,l:c.l||0,g:g,pf:c.pf||0,pa:c.pa||0,
      rate:g?Math.round((c.w||0)/g*100):0,diff:(c.pf||0)-(c.pa||0),streak:0,bestW:0});
  }
  rows.sort(function(a,b){
    return b.w-a.w||b.rate-a.rate||b.diff-a.diff||a.name.localeCompare(b.name,'ko');
  });
  return rows;
}

// 오늘 전적을 누적에 반영 (한 세션당 한 번만)
function saveCareer(){
  var rows=calcRecords();
  if(rows.length===0){toast('아직 입력된 경기 결과가 없어요');return;}
  if(S.statsSaved){toast('오늘 전적은 이미 반영했어요');return;}
  if(!confirm('오늘 전적을 누적 기록에 반영할까요?\n('+rows.length+'명 · 되돌릴 수 없어요)')) return;
  for(var i=0;i<rows.length;i++){
    var r=rows[i],c=S.career[r.name]||{w:0,l:0,g:0,pf:0,pa:0};
    c.w=(c.w||0)+r.w; c.l=(c.l||0)+r.l; c.g=(c.g||0)+r.g;
    c.pf=(c.pf||0)+r.pf; c.pa=(c.pa||0)+r.pa;
    S.career[r.name]=c;
  }
  S.statsSaved=true;
  fbSaveStats(); fbSaveSession(); render();
  toast('🏁 누적 전적에 반영했어요');
}

// 로테이션 공평성
// ══════════════════════════════════════════════════════════════════
function calcFairness(){
  var out={rows:[],blocks:0,minG:0,maxG:0,spread:0,dupPairs:[]};
  if(!S.matches||S.matches.length===0) return out;

  var names=[];
  for(var k in S.selected) if(S.selected[k]&&!S.lateArrivals[k]) names.push(k);
  if(names.length===0) return out;

  // 게임(블록) 목록
  var blockSet={};
  for(var i=0;i<S.matches.length;i++) blockSet[S.matches[i].blockNum||0]=true;
  var blocks=Object.keys(blockSet).map(Number).sort(function(a,b){return a-b;});
  out.blocks=blocks.length;

  // 게임별 출전자 + 파트너 조합 횟수
  var playedIn={},partner={};
  for(var bi=0;bi<blocks.length;bi++) playedIn[blocks[bi]]={};
  for(var mi=0;mi<S.matches.length;mi++){
    var m=S.matches[mi],bn=m.blockNum||0;
    var ts=[teamById(m.t1),teamById(m.t2)];
    for(var ti=0;ti<ts.length;ti++){
      var t=ts[ti];
      if(!t) continue;
      if(playedIn[bn]){playedIn[bn][t.p1.name]=true;playedIn[bn][t.p2.name]=true;}
      var key=pk(t.p1,t.p2);
      partner[key]=(partner[key]||0)+1;
    }
  }

  // 사람별 출전/휴식 집계
  for(var ni=0;ni<names.length;ni++){
    var nm=names[ni],g=0,r=0,mp=0,mr=0,cp=0,cr=0;
    for(var b2=0;b2<blocks.length;b2++){
      if(playedIn[blocks[b2]][nm]){g++;cp++;cr=0;if(cp>mp)mp=cp;}
      else {r++;cr++;cp=0;if(cr>mr)mr=cr;}
    }
    out.rows.push({name:nm,games:g,rests:r,maxPlay:mp,maxRest:mr});
  }
  if(out.rows.length===0) return out;

  // 2번 이상 같은 파트너
  for(var pkey in partner){
    if(partner[pkey]>1) out.dupPairs.push({names:pkey.split('||'),n:partner[pkey]});
  }
  out.dupPairs.sort(function(a,b){return b.n-a.n;});

  out.rows.sort(function(a,b){
    return b.games-a.games||a.name.localeCompare(b.name,'ko');
  });
  out.maxG=out.rows[0].games;
  out.minG=out.rows[out.rows.length-1].games;
  out.spread=out.maxG-out.minG;
  return out;
}

// 점수 입력 중에는 전체를 다시 그리지 않고 해당 경기 카드만 갱신한다.
// (전체 렌더를 하면 입력 칸이 사라져 포커스와 입력값이 날아감)
function refreshMatchCard(id){
  var card=document.querySelector('.mcard[data-mid="'+id+'"]');
  if(!card) return;
  var m=null;
  for(var i=0;i<S.matches.length;i++) if(S.matches[i].id===id){m=S.matches[i];break;}
  if(!m) return;

  var w=matchWinner(m);

  // 이긴 쪽 진영에 색을 입힌다
  var teams=card.querySelectorAll('.mteam');
  if(teams.length===2){
    teams[0].classList.toggle('won',w==='a');
    teams[1].classList.toggle('won',w==='b');
  }
  // 이긴 쪽 점수 칸 강조
  var ins=card.querySelectorAll('.score-in');
  if(ins.length===2){
    ins[0].classList.toggle('win',w==='a');
    ins[1].classList.toggle('win',w==='b');
  }
  // 코트 머리의 상태 문구
  var st=card.querySelector('.court-state');
  if(st){
    st.textContent=w?'끝':m.inProgress?'경기 중':m.done?'완료':'';
    st.className='court-state'+(w?' won':m.inProgress?' live':'');
  }
  card.classList.toggle('decided',!!w);
  card.classList.toggle('live',!w&&!!m.inProgress);
  card.style.opacity=(m.done&&!w)?'.62':'';

  // "전적 보기" 버튼의 입력 건수도 함께 갱신
  var cnt=document.getElementById('scored-cnt');
  if(cnt){var n=scoredCount();cnt.textContent=n>0?'('+n+')':'';}
}

      +'전체 '+f.blocks+'게임 중 <b style="color:var(--white)">'+f.minG+'~'+f.maxG+'게임</b> 출전 '
      +'· 편차 <b style="color:'+badge.c+'">'+f.spread+'</b>'

  for(var i=0;i<f.rows.length;i++){

    var col=(f.spread===0||r.games===f.maxG)?'var(--lime)'
           :(r.games===f.minG)?'var(--warn)':'var(--lime)';
    var op=(f.spread>0&&r.games!==f.maxG&&r.games!==f.minG)?'.55':'1';
    var flags='';
    // 한 번도 안 쉬면 전 경기 출전이므로 연속 출전 표시는 생략

    if(r.maxRest>=3) flags+='<span title="연속 휴식" style="color:var(--warn);font-weight:800"> 💤'+r.maxRest+'</span>';
    body+='<div class="fair-row">'
      +'<div class="fair-name">'+r.name+'</div>'
      +'<div class="fair-bar"><div class="fair-fill" style="width:'+pct+'%;background:'+col+';opacity:'+op+'"></div></div>'
      +'<div class="fair-num"><b style="color:var(--white)">'+r.games+'</b>게임 · 쉼'+r.rests+flags+'</div>'
      +'</div>';

      +(f.dupPairs.length>5?' 외 '+(f.dupPairs.length-5)+'쌍':'')
      +'</div>';
  }
  body+='</div>';

  return '<div style="border:1px solid var(--border);border-radius:12px;background:var(--fbox-bg);margin-bottom:12px">'+head+body+'</div>';
}

        var mObj=courtMs[mi],mt=mObj.m,mt1=mObj.t1,mt2=mObj.t2;
        var isDone=!!mt.done,isIP=!!mt.inProgress;
        var win=matchWinner(mt);
        var s1v=(mt.s1===0||mt.s1)?mt.s1:'';
        var s2v=(mt.s2===0||mt.s2)?mt.s2:'';

        // 코트 머리 — 코트 번호와 현재 상태
        var stateTxt=win?'끝':isIP?'경기 중':isDone?'완료':'';
        var stateCls=win?' won':isIP?' live':'';
        var topRow='<div class="court-top">'
          +'<span class="court-no" style="color:'+cc+'">'
            +'<span class="court-dot" style="background:'+cc+'"></span>'+cid+'코트</span>'
          +'<span class="court-state'+stateCls+'">'+stateTxt+'</span>'
          +'</div>';

        // 점수 — 각 팀 바로 아래 칸에 (누구 점수인지 헷갈리지 않게)
        var scoreRow='<div class="score-row">'
          +'<div class="score-cell">'
            +'<input class="score-in m-score'+(win==='a'?' win':'')+'" type="number" '
            +'inputmode="numeric" min="0" placeholder="–" '
            +'data-id="'+mt.id+'" data-s="1" value="'+s1v+'" '
            +'aria-label="'+mt1.p1.name+'·'+mt1.p2.name+' 점수"></div>'
          +'<span class="score-sep">:</span>'
          +'<div class="score-cell r">'
            +'<input class="score-in m-score'+(win==='b'?' win':'')+'" type="number" '
            +'inputmode="numeric" min="0" placeholder="–" '
            +'data-id="'+mt.id+'" data-s="2" value="'+s2v+'" '
            +'aria-label="'+mt2.p1.name+'·'+mt2.p2.name+' 점수"></div>'
          +'</div>';

        // 코트 발치 — 상태 버튼
        var footRow='<div class="court-foot">'
          +'<button class="cbtn'+(isIP?' warn':'')+'" data-a="ipMatch" data-id="'+mt.id+'">'
            +(isIP?'🏸 경기 중':'▶ 시작')+'</button>'
          +'<button class="cbtn'+(isDone?' on':'')+'" data-a="doneMatch" data-id="'+mt.id+'">'
            +(isDone?'✓ 완료됨':'✓ 완료')+'</button>'
          +(isDone?'<button class="cbtn del" data-a="delMatch" data-id="'+mt.id+'" '
            +'aria-label="이 경기 지우기">🗑</button>':'')
          +'</div>';

        function pcell(pl,tid,slot){
          var key=tid+'_'+slot;
          var sel=(S.swapSel===key);
          return '<div class="mname pswap'+(sel?' sel':'')+(hotNames[pl.name]?' hot':'')+'" data-a="swapPick" data-k="'+key+'" '
            +'draggable="true" data-drag="'+key+'" title="눌러서 자리 바꾸기">'+pl.name+'</div>';
        }
        var cardCls='mcard'+(win?' decided':isIP?' live':'');
        mCards+='<div class="'+cardCls+'" data-mid="'+mt.id+'" data-cc="'+cc+'"'
          +(isDone&&!win?' style="opacity:.62"':'')+'>'
          +topRow
          +'<div class="mbody">'
            +'<div class="mteam'+(win==='a'?' won':'')+'">'+pcell(mt1.p1,mt1.id,'p1')+pcell(mt1.p2,mt1.id,'p2')+'</div>'
            +'<div class="mteam r'+(win==='b'?' won':'')+'">'+pcell(mt2.p1,mt2.id,'p1')+pcell(mt2.p2,mt2.id,'p2')+'</div>'
          +'</div>'
          +scoreRow
          +footRow
          +'</div>';
      }
    }
    mCards+='</div></div>'; // court-grid, game-block
  }
  mCards+='</div>'; // game-list

  // ── 늦참 패널 ──
  var latePanel='';
  var lateNames=Object.keys(S.lateArrivals).filter(function(k){return S.selected[k]&&S.lateArrivals[k];});
  if(lateNames.length>0){
    latePanel='<div style="background:rgba(241,160,53,.08);border:1px solid rgba(241,160,53,.3);border-radius:12px;padding:12px;margin-bottom:14px">'
      +'<div style="font-weight:700;font-size:13px;color:#f1a035;margin-bottom:8px">🕐 늦참 대기 중</div>';
    for(var li=0;li<lateNames.length;li++){
      var ln=lateNames[li];
      var lc=S.playerGroups[ln]||1;
      var lcc=COURT_COLORS[(lc-1)%COURT_COLORS.length];
      latePanel+='<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(241,160,53,.15)">'
        +'<div>'
          +'<span style="font-weight:700;font-size:14px;color:var(--white)">'+ln+'</span>'
          +'<span style="font-size:11px;font-weight:700;color:'+lcc+';margin-left:6px">'+lc+'코트</span>'
        +'</div>'
        +'<button data-a="arriveLate" data-n="'+ln+'" style="padding:5px 14px;border-radius:8px;font-weight:700;font-size:12px;min-height:30px;background:rgba(241,160,53,.2);border:1px solid rgba(241,160,53,.5);color:#f1a035">✅ 도착!</button>'
      +'</div>';
    }
    latePanel+='</div>';
  }
  var latePanelHtml=latePanel;

  var hasMatches=S.matches.length>0;

  // 늦참 패널
  var lateArrivalsPanel='';
  var lateNames2=Object.keys(S.lateArrivals).filter(function(k){return S.selected[k];});
  if(lateNames2.length>0){
    lateArrivalsPanel='<div style="background:rgba(241,160,53,.08);border:1px solid rgba(241,160,53,.3);border-radius:12px;padding:12px;margin-bottom:14px">'
      +'<div style="font-weight:700;font-size:13px;color:#f1a035;margin-bottom:8px">🕐 늦참 대기 중 — 도착하면 눌러주세요</div>';
    for(var li=0;li<lateNames2.length;li++){
      var ln2=lateNames2[li];
      var lc2=S.playerGroups[ln2]||1;
      var lcc2=COURT_COLORS[(lc2-1)%COURT_COLORS.length];
      lateArrivalsPanel+='<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(241,160,53,.12)">'
        +'<div style="display:flex;align-items:center;gap:8px">'
          +'<span style="font-weight:700;font-size:15px;color:var(--white)">'+ln2+'</span>'
          +'<span style="font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:'+lcc2+'22;border:1px solid '+lcc2+'44;color:'+lcc2+'">'+lc2+'코트</span>'
        +'</div>'
        +'<button data-a="arriveLate" data-n="'+ln2+'" style="padding:7px 16px;border-radius:9px;font-weight:700;font-size:13px;background:var(--lime-soft);border:1px solid var(--lime);color:var(--lime)">✅ 도착!</button>'
      +'</div>';
    }
    lateArrivalsPanel+='</div>';
  }

  // ── 설정 레일 (넓은 화면에서 왼쪽 고정) ──
  // 대진표가 만들어지면 좁은 화면에서는 접어둔다 — 대진표가 주인공
  var setupOpen=!hasMatches||S.setupOpen;
  var curMode=MODES[0];
  for(var mmi=0;mmi<MODES.length;mmi++) if(MODES[mmi].key===S.pairMode) curMode=MODES[mmi];
  var railSum=curMode.lb+' · '+(S.numCourts||1)+'코트 '+(S.numGames||0)+'게임';

  var rail='<div class="card" style="margin-bottom:0">'
    +(hasMatches
      ?'<div class="ttl rail-title" style="margin-bottom:12px">대진표</div>'
       +'<button class="rail-toggle" data-a="togsetup" aria-expanded="'+(setupOpen?'true':'false')+'">'
         +'<span>⚙️ 대진표 설정</span>'
         +'<span class="rt-sum">'+railSum+' '+(setupOpen?'▲':'▼')+'</span>'
       +'</button>'
      :'<div class="ttl" style="margin-bottom:12px">대진표</div>')
    +'<div class="rail-body'+(setupOpen?'':' closed')+'">'
    +'<div class="lbl">팀 구성 방식</div>'
    +'<div class="mgrid">'+modeBtns+'</div>'
    +cycleNtc
    +groupModeHtml
    +'<button class="btn pri" data-a="genmatches" style="width:100%;margin-bottom:10px">🏸 대진표 작성</button>'
    +'<div class="brow">'
      +'<button class="btn gho" data-a="mg1">← 참석자</button>'
      +(hasMatches?'<button class="btn pri" data-a="mg4">🏆 전적 '
        +'<span id="scored-cnt" style="font-weight:700;opacity:.85">'
        +(scoredCount()>0?'('+scoredCount()+')':'')+'</span></button>':'')
    +'</div>'
    +'</div>'
    // 공유 버튼(카톡·이미지·인쇄)은 설정이 접혀 있어도 늘 보이도록 접히는 칸 밖에 둔다
    +(hasMatches
      ?'<div class="brow" style="margin-top:8px">'
         +'<button class="btn suc" data-a="cpr" style="flex:1 1 0;min-width:0;padding:12px 6px;font-size:var(--fs-sm);white-space:nowrap">📋 카톡</button>'
         +'<button class="btn gho" data-a="saveimg" style="flex:1 1 0;min-width:0;padding:12px 6px;font-size:var(--fs-sm);white-space:nowrap">🖼️ 이미지</button>'
         +'<button class="btn gho" onclick="printSchedule()" style="flex:1 1 0;min-width:0;padding:12px 6px;font-size:var(--fs-sm);white-space:nowrap">🖨️ 인쇄</button>'
       +'</div>'
      :'')
    +'</div>';

  // ── 대진표 본문 ──
  var swapHint=hasMatches
    ?'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:10px 13px;'
      +'border-radius:var(--r-m);background:var(--court-soft);font-size:var(--fs-xs);color:var(--ink-2)">'
      +(S.swapSel
        ?'<span style="color:var(--court);font-weight:700">👆 바꿀 상대를 한 번 더 누르세요</span>'
          +'<button class="cbtn" data-a="swapCancel" style="margin-left:auto;flex:0 0 auto;padding:6px 12px">취소</button>'
        :'<span>✋ 선수 이름을 <b style="color:var(--court)">두 명 차례로 누르면</b> 자리가 바뀌어요</span>')
      +'</div>'
    :'';

  var streakNtc=(function(){
        if(!hasMatches) return '';
        var st=calcStreaks();
        if(st.playing.length===0&&st.resting.length===0) return '';
        // 인원이 많으면 이름을 다 늘어놓지 않고 줄여서 (자세한 내용은 공평성 패널)
        function nameList(arr){
          if(arr.length<=5) return arr.join(', ');
          return arr.slice(0,5).join(', ')+' 외 '+(arr.length-5)+'명';
        }
        var rows='';
        if(st.playing.length>0){
          rows+='<div style="display:flex;align-items:flex-start;gap:7px;margin-bottom:'+(st.resting.length>0?'6px':'0')+'">'
            +'<span style="flex-shrink:0">🔥</span>'
            +'<span><b style="color:var(--flag)">3게임 연속 출전</b> : '+nameList(st.playing)+'</span>'
          +'</div>';
        }
        if(st.resting.length>0){
          rows+='<div style="display:flex;align-items:flex-start;gap:7px">'
            +'<span style="flex-shrink:0">💤</span>'
            +'<span><b style="color:var(--shuttle)">3게임 연속 휴식</b> : '+nameList(st.resting)+'</span>'
          +'</div>';
        }
        return '<div style="margin-bottom:10px;padding:12px 14px;border-radius:var(--r-m);'
          +'background:var(--shuttle-soft);font-size:var(--fs-xs);color:var(--ink-1);line-height:1.6">'+rows+'</div>';
      })();

  var mainEmpty='<div class="card"><div class="empty">'
    +'<div class="empty-icon">🏸</div>'
    +'<div class="empty-txt">아직 대진표가 없어요</div>'
    +'<div class="empty-sub">팀 구성 방식을 고르고 대진표 작성을 누르세요</div>'
    +'</div></div>';

  var main=hasMatches
    ? lateArrivalsPanel+sbNtc+dupNtc+swapHint+streakNtc+fairnessHtml()+mCards
    : lateArrivalsPanel+mainEmpty;

  return '<div class="m-layout">'
    +'<div class="m-rail">'+rail+'</div>'
    +'<div class="m-main">'+main+'</div>'
    +'</div>';
}

function recTableHtml(rows,isCareer){
  var head='<div class="rec-head">'
    +'<div style="text-align:center">#</div><div>이름</div>'
    +'<div class="rec-num">승</div><div class="rec-num">패</div>'
    +'<div class="rec-num">승률</div><div class="rec-num">'+(isCareer?'득실':'연승')+'</div>'
    +'</div>';
  var body='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    // 승률 색: 60% 이상 라임 / 40% 미만 빨강 / 그 사이 기본
    var rateCol=r.rate>=60?'var(--lime)':r.rate<40?'var(--red)':'var(--white)';
    var last;
    if(isCareer){
      last='<span style="color:'+(r.diff>0?'var(--lime)':r.diff<0?'var(--red)':'var(--muted)')+'">'
        +(r.diff>0?'+':'')+r.diff+'</span>';
    } else if(r.streak>=2){
      last='<span style="color:var(--lime);font-weight:800">🔥'+r.streak+'</span>';
    } else if(r.streak<=-2){
      last='<span style="color:var(--red);font-weight:800">❄'+(-r.streak)+'</span>';
    } else {
      last='<span style="color:var(--muted)">-</span>';
    }
    body+='<div class="rec-row">'
      +'<div class="rec-rank">'+medal+'</div>'
      +'<div class="rec-name">'+r.name+'</div>'
      +'<div class="rec-num" style="font-weight:800;color:var(--lime)">'+r.w+'</div>'
      +'<div class="rec-num" style="color:var(--muted)">'+r.l+'</div>'
      +'<div class="rec-num" style="font-weight:700;color:'+rateCol+'">'+r.rate+'%</div>'
      +'<div class="rec-num">'+last+'</div>'
      +'</div>';
  }
  return '<div style="border:1px solid var(--border);border-radius:12px;background:var(--fbox-bg);padding:4px 8px">'+head+body+'</div>';
}

function mStep3Html(){
  var isCareer=S.recView==='career';
  var rows=isCareer?careerRows():calcRecords();
  var total=S.matches.length, scored=scoredCount();

  var seg='<div class="seg">'
    +'<button class="seg-btn'+(isCareer?'':' active')+'" data-a="recview" data-v="today">📅 오늘</button>'
    +'<button class="seg-btn'+(isCareer?' active':'')+'" data-a="recview" data-v="career">🏅 누적</button>'
    +'</div>';

  var body;
  if(rows.length===0){
    body='<div class="empty"><div class="empty-icon">'+(isCareer?'🏅':'📝')+'</div>'
      +'<div class="empty-txt">'+(isCareer?'누적 전적이 아직 없어요':'입력된 경기 결과가 없어요')+'</div>'
      +'<div class="empty-sub">'+(isCareer
        ?'오늘 전적을 "누적에 반영"하면 여기에 쌓여요'
        :'대진표에서 경기별 점수를 입력해 주세요')+'</div></div>';
  } else {
    body=recTableHtml(rows,isCareer);
  }

  // 오늘 화면: 진행 상황 + 누적 반영 버튼
  var todayExtra='';
  if(!isCareer){
    var pct=total>0?Math.round(scored/total*100):0;
    todayExtra='<div style="margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px">'
        +'<span>결과 입력</span><span><b style="color:var(--white)">'+scored+'</b> / '+total+'게임</span>'
      +'</div>'
      +'<div class="fair-bar"><div class="fair-fill" style="width:'+pct+'%;background:var(--lime)"></div></div>'
      +'</div>';
  }

  var actions='';
  if(!isCareer){
    actions='<div class="brow" style="margin-top:14px">'
      +'<button class="btn gho" data-a="mg3" style="flex:1">← 대진표</button>'
      +'<button class="btn '+(S.statsSaved||scored===0?'gho':'pri')+'" data-a="savecareer" style="flex:1;font-size:13px"'
        +(S.statsSaved||scored===0?' disabled':'')+'>'
        +(S.statsSaved?'✅ 반영 완료':'🏁 누적에 반영')+'</button>'
      +'</div>';
  } else {
    actions='<div class="brow" style="margin-top:14px">'
      +'<button class="btn gho" data-a="mg3" style="flex:1">← 대진표</button>'
      +(rows.length>0?'<button class="btn dan" data-a="clearcareer" style="flex:1;font-size:13px">🗑 누적 초기화</button>':'')
      +'</div>';
  }

  var note='';
  if(!isCareer&&S.statsSaved){
    note=ntc('var(--lime)','✅','오늘 전적은 누적에 반영됐어요','새 대진표를 만들면 다시 반영할 수 있어요');
  } else if(!isCareer&&scored>0&&scored<total){
    note=ntc('var(--warn)','📝','아직 입력 안 된 경기가 있어요',(total-scored)+'게임의 점수를 더 입력하면 전적이 정확해져요');
  }

  return '<div class="ttl" style="margin-bottom:10px">전적</div>'
    +seg+todayExtra+note+body+actions;
}

// Step 1: 참석자 선택 + 팀 구성
function tStep1Html(){
  if(S.roster.length===0){
    return '<div class="empty"><div class="empty-icon">📋</div>'
      +'<div class="empty-txt">명단이 비어있어요</div>'
      +'<div class="empty-sub">먼저 "명단 관리"에서 회원을 등록해주세요</div></div>'
      +'<button class="btn pri" data-a="gotab" data-v="roster" style="width:100%;margin-top:12px">명단 등록하러 가기 →</button>';
  }
  var selCount=Object.keys(S.tSelected).filter(function(k){return S.tSelected[k];}).length;
  var allSel=selCount===S.roster.length;
  var q=(S.tSearch||'').trim().toLowerCase();
  var filtered=q?S.roster.filter(function(p){return p.name.toLowerCase().indexOf(q)!==-1;}):S.roster;

  var out='<div class="ttl">🏆 토너먼트</div>'
    +'<div class="sub" style="margin-bottom:14px">참석자를 고르면 2명씩 팀으로 묶어 단판 토너먼트를 진행해요</div>';

  // 검색
  out+='<div style="position:relative;margin-bottom:10px">'
    +'<input id="tsrch" class="inp" placeholder="🔍 이름 검색..." value="'+(S.tSearch||'')+'" autocomplete="off" autocorrect="off" style="padding-right:36px">'
    +(q?'<button data-a="tsrchclr" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:transparent;font-size:16px;color:var(--muted);padding:0">×</button>':'')
    +'</div>';
  // 선택 현황
  out+='<div class="select-bar" style="margin-bottom:8px">'
    +'<span class="select-count" style="font-size:16px;font-weight:800;color:var(--lime)">🏆 '+selCount+'명 선택</span>'
    +'<button class="select-all-btn" data-a="tselall" data-v="'+(allSel?'none':'all')+'">'+(allSel?'전체 해제':'전체 선택')+'</button>'
    +'</div>';

  // 참석자 목록
  out+='<div id="t-attend-body">';
  for(var i=0;i<filtered.length;i++){
    var p=filtered[i],isSel=!!S.tSelected[p.name];
    out+='<div class="attend-item'+(isSel?' selected':'')+'" data-a="tToggle" data-n="'+p.name+'" style="border-left:3px solid '+(isSel?'var(--lime)':'transparent')+';padding-left:10px">'
      +'<div class="chk-box'+(isSel?' on':'')+'">'+(isSel?'✓':'')+'</div>'
      +'<div class="attend-info"><div class="attend-name">'+p.name+'</div>'
      +'<div class="attend-badges">'+gbadge(p.gender)+lvbadge(p.level)+'</div></div>'
      +'</div>';
  }
  out+='</div>';

  if(selCount%2===1){

  // 이미 팀이 짜여 있으면 표시 + 브래킷 시작
